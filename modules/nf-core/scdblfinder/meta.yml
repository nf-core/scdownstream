name: "scdblfinder"
description: Detect doublets in single-cell RNA-seq data with scDblFinder
keywords:
- doublet detection
- single-cell
- scrnaseq
- quality control
tools:
- "scdblfinder":
    description: "Identifies doublets in single-cell RNA-seq data by comparing each cell with artificial doublets made from the data"
    homepage: "https://bioconductor.org/packages/scDblFinder"
    documentation: "https://bioconductor.org/packages/release/bioc/vignettes/scDblFinder/inst/doc/scDblFinder.html"
    tool_dev_url: "https://github.com/plger/scDblFinder"
    doi: "10.12688/f1000research.73600.2"
    licence: ["GPL-3.0-only"]
    identifier: biotools:scdblfinder

input:
- - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. `[ id:'sample1' ]`
  - h5ad:
      type: file
      description: AnnData object in h5ad format with raw counts in `X`
      pattern: "*.h5ad"
      ontologies:
      - edam: http://edamontology.org/format_3590     # HDF5

output:
  h5ad:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - "${prefix}.h5ad":
        type: file
        description: Input AnnData object with the scDblFinder columns added to `obs`, stored with gzip compression
        pattern: "*.h5ad"
        ontologies:
        - edam: http://edamontology.org/format_3590     # HDF5
  predictions:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - "${prefix}.predictions.parquet":
        type: file
        description: One Boolean column per cell (TRUE = doublet), with explicit __index__ cell identifiers
        pattern: "*.predictions.parquet"
        ontologies: []
  scores:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - "${prefix}.scores.parquet":
        type: file
        description: Per-cell scDblFinder results (class, score and related columns)
        pattern: "*.scores.parquet"
        ontologies: []
  versions_scdblfinder:
  - versions.yml:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
      ontologies:
      - edam: http://edamontology.org/format_3750     # YAML

topics:
  versions:
  - versions.yml:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
      ontologies:
      - edam: http://edamontology.org/format_3750     # YAML

authors:
- "@iraajgangavaram"
maintainers:
- "@iraajgangavaram"
