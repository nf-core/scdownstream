name: "seurat_integration"
description: Integrate single-cell batches with Seurat and write results to AnnData
keywords:
  - integration
  - batch-correction
  - single-cell
  - seurat
tools:
  - "seurat":
      description: "R toolkit for single-cell genomics"
      homepage: "https://satijalab.org/seurat"
      documentation: "https://satijalab.org/seurat/articles/integration_introduction.html"
      tool_dev_url: "https://github.com/satijalab/seurat"
      licence: ["MIT"]
      identifier: biotools:seurat

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - batch_col:
      type: string
      description: obs column containing batch labels for integration

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData object with Seurat-integrated embedding
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
