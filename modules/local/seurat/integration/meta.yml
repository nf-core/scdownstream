name: "seurat_integration"
description: Integrate single-cell batches with Seurat anchor-based integration
keywords:
  - integration
  - batch-correction
  - single-cell
  - seurat
tools:
  - "seurat":
      description: "Integrated analysis of multimodal single-cell data"
      homepage: "https://satijalab.org/seurat"
      documentation: "https://satijalab.org/seurat/articles"
      tool_dev_url: "https://github.com/satijalab/seurat"
      doi: "10.1038/s41596-021-00934-9"
      licence: ["MIT"]
      identifier: biotools:seurat

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - batch_col:
      type: string
      description: obs column containing batch labels used for Seurat integration

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData object with Seurat integrated embedding stored in obsm
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750"

authors:
  - "@nictru"
maintainers:
  - "@nictru"
