name: "scimilarity_annotate"
description: Annotate cell types by nearest-neighbour search in the SCimilarity reference
keywords:
  - annotation
  - cell-type
  - scimilarity
  - single-cell
tools:
  - "scimilarity":
      description: "A unifying representation of single cell expression profiles for cell search and annotation"
      homepage: "https://genentech.github.io/scimilarity"
      documentation: "https://genentech.github.io/scimilarity"
      tool_dev_url: "https://github.com/Genentech/scimilarity"
      licence: ["Apache-2.0"]

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - h5ad:
        type: file
        description: AnnData object in h5ad format with a SCimilarity embedding in obsm X_emb
        pattern: "*.{h5ad}"
  - - meta2:
        type: map
        description: Groovy Map containing model information
    - model:
        type: directory
        description: Directory containing the pretrained SCimilarity model

output:
  h5ad:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.h5ad":
          type: file
          description: AnnData with SCimilarity cell type annotation in obs
          pattern: "*.h5ad"
  obs:
    - "*.parquet":
        type: file
        description: Parquet obs data frame with the SCimilarity annotation and an explicit __index__ column
        pattern: "*.parquet"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"

authors:
  - "@nictru"
maintainers:
  - "@nictru"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/python_anndata_pyarrow_pyyaml_pruned:f4f0615a5198942f
      build_id: bd-f4f0615a5198942f_1
      scan_id: sc-eef9e437547c5870_1
