name: "scimilarity_embed"
description: Embed cells into the SCimilarity latent space using a pretrained model
keywords:
  - embedding
  - reference-mapping
  - scimilarity
  - single-cell
tools:
  - "scimilarity":
      description: "A unifying representation of single cell expression profiles for cell search and annotation"
      homepage: "https://genentech.github.io/scimilarity"
      documentation: "https://genentech.github.io/scimilarity"
      tool_dev_url: "https://github.com/Genentech/scimilarity"
      licence: ["Apache-2.0"]

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - h5ad:
        type: file
        description: AnnData object in h5ad format with raw counts in X
        pattern: "*.{h5ad}"
  - - meta2:
        type: map
        description: Groovy Map containing model information
    - model:
        type: directory
        description: Directory containing the pretrained SCimilarity model

output:
  h5ad:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.h5ad":
          type: file
          description: AnnData with SCimilarity embedding in obsm
          pattern: "*.h5ad"
  obsm:
    - "X_*.parquet":
        type: file
        description: Parquet SCimilarity embedding matrix with explicit __index__ cell identifiers
        pattern: "X_*.parquet"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"

authors:
  - "@nictru"
maintainers:
  - "@nictru"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/python_anndata_pyarrow_pyyaml_pruned:bb1a128a5af6fc5c
