name: "liana_rankaggregate"
description: Run LIANA rank_aggregate ligand-receptor analysis with optional plots
keywords:
  - single-cell
  - cell-cell-communication
  - liana
  - ligand-receptor
tools:
  - "liana":
      description: "LIANA+: a one-stop-shop framework for cell-cell communication."
      homepage: "https://liana-py.readthedocs.io"
      documentation: "https://liana-py.readthedocs.io"
      tool_dev_url: "https://github.com/saezlab/liana-py"
      doi: "10.1038/s41556-024-01469-w"
      licence: ["GPL-3.0-or-later"]
      identifier: biotools:liana

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
  - n_perms:
      type: integer
      description: Number of permutations for specificity testing; 0 disables permutations
  - max_cells:
      type: integer
      description: Optional maximum cells before stratified subsampling; 0 disables subsampling
  - subsample_strategy:
      type: string
      description: Stratified subsampling strategy when max_cells is set
  - subsample_seed:
      type: integer
      description: Random seed for subsampling and LIANA

output:
  h5ad:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.h5ad":
          type: file
          description: Optional AnnData with LIANA results stored in uns
          pattern: "*.h5ad"
  uns:
    - "*.pkl":
        type: file
        description: Optional pickled uns contents including LIANA results
        pattern: "*.pkl"
  plots:
    - "*.png":
        type: file
        description: Optional LIANA summary plots
        pattern: "*.png"
  multiqc_files:
    - "*_mqc.json":
        type: file
        description: Optional MultiQC custom content JSON for LIANA plots
        pattern: "*_mqc.json"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"

authors:
  - "@nictru"
maintainers:
  - "@nictru"
