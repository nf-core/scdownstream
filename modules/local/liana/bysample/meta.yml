name: "liana_bysample"
description: Run LIANA rank_aggregate by sample/context for tensor-cell2cell
keywords:
  - single-cell
  - cell-cell-communication
  - liana
  - ligand-receptor
tools:
  - "liana":
      description: "LIANA+: a one-stop-shop framework for cell-cell communication."
      homepage: "https://liana-py.readthedocs.io"
      documentation: "https://liana-py.readthedocs.io"
      tool_dev_url: "https://github.com/saezlab/liana-py"
      doi: "10.1038/s41556-024-01469-w"
      licence: ["GPL-3.0-or-later"]
      identifier: biotools:liana

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - obs_key:
      type: string
      description: obs column used to group cells for LIANA
  - context_key:
      type: string
      description: obs column used as the LIANA by-sample context
  - n_perms:
      type: integer
      description: Number of permutations for specificity testing; 0 disables permutations
  - max_cells:
      type: integer
      description: Optional maximum cells before stratified subsampling; 0 disables subsampling
  - subsample_strategy:
      type: string
      description: |
        Stratified subsampling strategy when max_cells is set.
        By-sample always includes the context column in the strata, then drops contexts
        with fewer than two cell groups of at least five cells.
  - subsample_seed:
      type: integer
      description: Random seed for subsampling and LIANA
  - apply_log1p:
      type: boolean
      description: Apply log1p to X before LIANA; false when the caller supplies log-transformed expression
  - species:
      type: string
      description: Species used to select the LIANA resource, human or mouse

output:
  results:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.csv.gz":
          type: file
          description: Compressed long-format LIANA by-sample results
          pattern: "*.csv.gz"
          ontologies:
            - edam: "http://edamontology.org/format_3752"
  contexts:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*_contexts.tsv":
          type: file
          description: Context metadata table with optional condition column
          pattern: "*_contexts.tsv"
          ontologies:
            - edam: "http://edamontology.org/format_3475"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750"

authors:
  - "@nictru"
maintainers:
  - "@nictru"
