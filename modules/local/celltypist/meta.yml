name: "celltypist"
description: Annotate cell types in an AnnData object using CellTypist models
keywords:
  - cell-type
  - annotation
  - single-cell
  - scrnaseq
tools:
  - "celltypist":
      description: "Automated cell type annotation for scRNA-seq datasets"
      homepage: "https://www.celltypist.org"
      documentation: "https://celltypist.readthedocs.io"
      tool_dev_url: "https://github.com/Teichlab/celltypist"
      licence: ["MIT"]
      identifier: biotools:celltypist

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
    - symbol_col:
        type: string
        description: Feature metadata column containing gene symbols
  - models:
      type: list
      description: Names of CellTypist models to download and use for annotation
  - model_files:
      type: file
      description: Custom CellTypist model files to use for annotation. The file stem is used as the model name.
      pattern: "*.pkl"

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData object with CellTypist annotations
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  obs:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.parquet":
          type: file
          description: Parquet observation annotations from CellTypist with an explicit __index__ column
          pattern: "*.parquet"
  annotation_columns:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*_annotation_columns.csv":
          type: file
          description: CSV listing annotation columns and whether they are aggregatable
          pattern: "*_annotation_columns.csv"
          ontologies:
            - edam: "http://edamontology.org/format_3752"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
