name: "celltypist"
description: Annotate single-cell profiles with pretrained CellTypist models
keywords:
  - cell-type
  - annotation
  - single-cell
  - celltypist
tools:
  - "celltypist":
      description: "Automated cell type annotation for single-cell RNA-seq data"
      homepage: "https://www.celltypist.org"
      documentation: "https://celltypist.readthedocs.io"
      tool_dev_url: "https://github.com/Teichlab/celltypist"
      doi: "10.1126/science.abl5197"
      licence:
        - "MIT"
      identifier: biotools:celltypist

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
    - symbol_col:
        type: string
        description: var column containing gene symbols used for CellTypist annotation
  - models:
      type: string
      description: Comma-separated list of CellTypist model names to apply

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData object with CellTypist annotation columns added to obs
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  obs:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.pkl":
          type: file
          description: Pickled obs subset containing CellTypist annotation columns
          pattern: "*.pkl"
          ontologies: []
  annotation_columns:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*_annotation_columns.csv":
          type: file
          description: CSV listing obs columns produced by CellTypist and whether they are aggregatable
          pattern: "*_annotation_columns.csv"
          ontologies:
            - edam: "http://edamontology.org/format_3752" # CSV
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
topics:
  versions:
    - versions.yml:
        type: string
        description: The name of the process
authors:
  - "@nictru"
maintainers:
  - "@nictru"
