name: "soupx"
description: Estimate and remove ambient RNA contamination with SoupX
keywords:
  - ambient-rna
  - decontamination
  - single-cell
  - soupx
tools:
  - "soupx":
      description: "Removal of ambient RNA from single-cell RNA-seq data"
      homepage: "https://github.com/constantAmateur/SoupX"
      documentation: "https://github.com/constantAmateur/SoupX"
      tool_dev_url: "https://github.com/constantAmateur/SoupX"
      doi: "10.1093/gigascience/giaa151"
      licence: ["GPL-3.0-or-later"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: Filtered AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
    - raw:
        type: file
        description: Raw counts AnnData object in h5ad format used to estimate the soup profile
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - cluster_resolution:
      type: number
      description: Clustering resolution used by SoupX to define expression clusters
  - input_layer:
      type: string
      description: AnnData layer to read counts from (`X` or a layer name)
  - output_layer:
      type: string
      description: AnnData layer name where corrected counts are stored

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData object with SoupX-corrected counts in the specified output layer
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750"

authors:
  - "@nictru"
maintainers:
  - "@nictru"
