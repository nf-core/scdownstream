name: "soupx"
description: Estimate and remove ambient RNA contamination with SoupX
keywords:
  - ambient-rna
  - decontamination
  - single-cell
  - scrnaseq
tools:
  - "soupx":
      description: "SoupX removes ambient RNA contamination from droplet-based scRNA-seq"
      homepage: "https://github.com/constantAmateur/SoupX"
      documentation: "https://cran.r-project.org/web/packages/SoupX/vignettes/SoupX.html"
      tool_dev_url: "https://github.com/constantAmateur/SoupX"
      licence: ["GPL-2.0"]
      identifier: biotools:soupx

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: Filtered AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
    - raw:
        type: file
        description: Raw (unfiltered) AnnData object used to estimate the ambient soup
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - cluster_resolution:
      type: number
      description: Clustering resolution used when estimating contamination
  - input_layer:
      type: string
      description: AnnData layer containing raw counts (`X` or a layer name)
  - output_layer:
      type: string
      description: AnnData layer name for corrected counts

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData object with SoupX-corrected counts in the output layer
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
