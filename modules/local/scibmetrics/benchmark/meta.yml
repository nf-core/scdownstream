name: "scibmetrics_benchmark"
description: Compute scIB integration metrics for an AnnData embedding
keywords:
  - integration
  - benchmarking
  - metrics
  - single-cell
tools:
  - "scib-metrics":
      description: "Accelerated and Python-native implementation of scIB integration metrics"
      homepage: "https://scib-metrics.readthedocs.io"
      documentation: "https://scib-metrics.readthedocs.io"
      tool_dev_url: "https://github.com/YosefLab/scib-metrics"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object with embeddings and metadata for benchmarking
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - max_cells:
      type: integer
      description: Maximum number of cells to keep after subsampling
  - subsample_strategy:
      type: string
      description: Strategy used to subsample cells before metric calculation
  - subsample_seed:
      type: integer
      description: Random seed for reproducible subsampling
  - metric_profile:
      type: string
      description: Named profile selecting which scIB metrics to compute

output:
  metrics:
    - "*_metrics.tsv":
        type: file
        description: Tab-separated table of computed integration metrics
        pattern: "*_metrics.tsv"
        ontologies:
          - edam: "http://edamontology.org/format_3475"
  benchmark_info:
    - "*_benchmark_info.json":
        type: file
        description: JSON metadata describing the benchmark run
        pattern: "*_benchmark_info.json"
        ontologies:
          - edam: "http://edamontology.org/format_3464"
  multiqc_files:
    - "*_mqc.json":
        type: file
        description: MultiQC-compatible JSON with benchmark results
        pattern: "*_mqc.json"
        ontologies:
          - edam: "http://edamontology.org/format_3464"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
