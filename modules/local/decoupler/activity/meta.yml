name: "decoupler_activity"
description: Score pathway and transcription factor activities on pseudobulk profiles with decoupler
keywords:
  - pathway
  - transcription-factor
  - pseudobulk
  - single-cell
tools:
  - "decoupler":
      description: "Python package to perform enrichment and pseudobulk analysis from omics data"
      homepage: "https://decoupler.readthedocs.io/"
      documentation: "https://decoupler.readthedocs.io/"
      tool_dev_url: "https://github.com/saezlab/decoupler-py"
      licence: ["GPL-3.0"]

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - h5ad:
        type: file
        description: Pseudobulk AnnData with raw counts in X, as written by DECOUPLER_PSEUDOBULK
        pattern: "*.{h5ad}"
  - networks:
      type: file
      description: Networks from DECOUPLER_NETWORK; the file stem names the resource
      pattern: "*.tsv"
  - method:
      type: string
      description: decoupler method name, for example `ulm`, `mlm`, `viper` or `aucell`
  - tmin:
      type: integer
      description: Minimum number of targets per source after intersection with the data

output:
  scores:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${prefix}_*_scores.parquet":
          type: file
          description: Long table of scores and adjusted p-values per pseudobulk sample and source, one file per network
          pattern: "*_scores.parquet"
  uns:
    - "${prefix}_decoupler_activity.pkl":
        type: file
        description: Pickled dict of score tables keyed by network, stored in `uns`
        pattern: "*_decoupler_activity.pkl"
  plots:
    - "*_activity.png":
        type: file
        description: Heatmap of mean scores per cell type and condition
        pattern: "*_activity.png"
  multiqc_files:
    - "*_mqc.json":
        type: file
        description: MultiQC custom content with the embedded heatmap
        pattern: "*_mqc.json"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"

authors:
  - "@nictru"
maintainers:
  - "@nictru"
