name: "decoupler_network"
description: Prepare a prior-knowledge network for decoupler from Omnipath resources or a custom file
keywords:
  - pathway
  - transcription-factor
  - prior-knowledge
  - omnipath
tools:
  - "decoupler":
      description: "Python package to perform enrichment and pseudobulk analysis from omics data"
      homepage: "https://decoupler.readthedocs.io/"
      documentation: "https://decoupler.readthedocs.io/"
      tool_dev_url: "https://github.com/saezlab/decoupler-py"
      licence: ["GPL-3.0"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map with the network name in `id`. Without a custom file, `id` selects the
          Omnipath resource (`progeny`, `collectri` or `hallmark`).
    - custom_network:
        type: file
        description: |
          Optional custom network. TSV or CSV files need `source` and `target` columns and may
          contain a `weight` column. GMT files are read as unweighted gene sets.
        pattern: "*.{tsv,txt,csv,gmt}"
  - species:
      type: string
      description: Organism used for Omnipath resources, for example `human` or `mouse`

output:
  network:
    - - meta:
          type: map
          description: Groovy Map with the network name in `id`
      - "${prefix}.tsv":
          type: file
          description: Network in long format with `source`, `target` and `weight` columns
          pattern: "*.tsv"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"

authors:
  - "@nictru"
maintainers:
  - "@nictru"
