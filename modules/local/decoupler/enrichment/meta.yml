name: "decoupler_enrichment"
description: Run decoupler enrichment on pseudobulk differential expression statistics
keywords:
  - pathway
  - transcription-factor
  - enrichment
  - differential-expression
tools:
  - "decoupler":
      description: "Python package to perform enrichment and pseudobulk analysis from omics data"
      homepage: "https://decoupler.readthedocs.io/"
      documentation: "https://decoupler.readthedocs.io/"
      tool_dev_url: "https://github.com/saezlab/decoupler-py"
      licence: ["GPL-3.0"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information. `de_method` is appended to the default prefix.
    - de_results:
        type: file
        description: |
          Standardised DE parquet files with `gene`, `log2fc`, `pvalue`, `padj`, `group`, `contrast`
          and `stratum` columns. The `stat` column is used when present, otherwise the signed
          -log10 p-value.
        pattern: "*.parquet"
  - networks:
      type: file
      description: Networks from DECOUPLER_NETWORK; the file stem names the resource
      pattern: "*.tsv"
  - method:
      type: string
      description: decoupler method name, for example `ulm`, `mlm`, `viper` or `aucell`
  - tmin:
      type: integer
      description: Minimum number of targets per source after intersection with the data

output:
  results:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "${prefix}_enrichment.parquet":
          type: file
          description: |
            Long table with `resource`, `source`, `score`, `padj`, `stratum`, `contrast`, `group`
            and `de_method` columns
          pattern: "*_enrichment.parquet"
  uns:
    - "${prefix}_decoupler_enrichment.pkl":
        type: file
        description: Pickled dict of enrichment tables keyed by network, stored in `uns`
        pattern: "*_decoupler_enrichment.pkl"
  plots:
    - "*_enrichment.png":
        type: file
        description: Dot plot of the top sources per stratum and contrast
        pattern: "*_enrichment.png"
  multiqc_files:
    - "*_mqc.json":
        type: file
        description: MultiQC custom content with the embedded dot plot
        pattern: "*_mqc.json"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"

authors:
  - "@nictru"
maintainers:
  - "@nictru"
