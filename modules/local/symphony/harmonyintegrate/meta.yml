name: "symphony_harmonyintegrate"
description: Build a Symphony reference by integrating batches with Harmony
keywords:
  - integration
  - batch-correction
  - symphony
  - single-cell
tools:
  - "symphonypy":
      description: "Python port of Symphony for reference building and query mapping"
      homepage: "https://github.com/potulabe/symphonypy"
      documentation: "https://github.com/potulabe/symphonypy"
      tool_dev_url: "https://github.com/potulabe/symphonypy"
      licence: ["GPL-3.0"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - batch_col:
      type: string
      description: obs column containing batch labels for Harmony
  - counts_layer:
      type: string
      description: AnnData layer containing counts for reference building

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: Integrated AnnData with Harmony embedding
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  reference:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*_reference.h5ad":
          type: file
          description: Symphony reference AnnData for downstream query mapping
          pattern: "*_reference.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  obsm:
    - "X_*.parquet":
        type: file
        description: Parquet Harmony embedding with explicit __index__ cell identifiers
        pattern: "X_*.parquet"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
