name: "symphony_mapembedding"
description: Map query single-cell data onto a Symphony reference embedding
keywords:
  - integration
  - reference-mapping
  - single-cell
  - symphony
tools:
  - "symphonypy":
      description: "Fast, accurate, and scalable batch-correction of single-cell data with Symphony"
      homepage: "https://github.com/immunogenomics/symphony"
      documentation: "https://github.com/immunogenomics/symphony"
      tool_dev_url: "https://github.com/immunogenomics/symphony"
      doi: "10.1038/s41467-021-25928-x"
      licence: ["GPL-3.0-or-later"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: Query AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. `[ id:'reference1' ]`
    - reference_h5ad:
        type: file
        description: Symphony reference AnnData object produced by symphony harmonyintegrate
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - batch_col:
      type: string
      description: obs column containing batch labels used during query mapping
  - counts_layer:
      type: string
      description: AnnData layer to read counts from (`X` or a layer name)

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData object with Symphony-mapped embedding stored in obsm
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  obsm:
    - "X_*.pkl":
        type: file
        description: Pickled Symphony-mapped embedding stored in obsm
        pattern: "X_*.pkl"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750"

authors:
  - "@nictru"
maintainers:
  - "@nictru"
