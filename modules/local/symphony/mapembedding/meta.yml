name: "symphony_mapembedding"
description: Map a query AnnData onto a Symphony reference embedding
keywords:
  - query-mapping
  - integration
  - symphony
  - single-cell
tools:
  - "symphonypy":
      description: "Python port of Symphony for reference building and query mapping"
      homepage: "https://github.com/potulabe/symphonypy"
      documentation: "https://github.com/potulabe/symphonypy"
      tool_dev_url: "https://github.com/potulabe/symphonypy"
      licence: ["GPL-3.0"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: Query AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. `[ id:'reference' ]`
    - reference_h5ad:
        type: file
        description: Symphony reference AnnData produced by harmonyintegrate
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - batch_col:
      type: string
      description: Optional obs column containing query batch labels
  - counts_layer:
      type: string
      description: AnnData layer containing counts for query mapping

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: Query AnnData with mapped Symphony embedding
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  obsm:
    - "X_*.pkl":
        type: file
        description: Mapped embedding stored as a pickle
        pattern: "X_*.pkl"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
