name: "cytetype"
description: Annotate cell types in single-cell data with the CyteType API
keywords:
  - cell-type
  - annotation
  - single-cell
  - cytetype
tools:
  - "cytetype":
      description: "AI-powered cell type annotation for single-cell RNA-seq data"
      homepage: "https://cytetype.app"
      documentation: "https://cytetype.readthedocs.io"
      tool_dev_url: "https://github.com/cytetype/cytetype"
      licence: ["MIT"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - symbol_col:
      type: string
      description: var column containing gene symbols used for CyteType annotation
  - study_context:
      type: string
      description: Free-text study context passed to the CyteType API
  - group_key:
      type: string
      description: obs column used to group cells for differential expression ranking
  - rank_key:
      type: string
      description: obs column whose groups are ranked for marker gene selection
  - integration:
      type: string
      description: obsm key used for neighbourhood graph construction before clustering
  - resolution:
      type: number
      description: Leiden clustering resolution when cluster labels are derived within the module

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData object with CyteType annotation columns added to obs
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  obs:
    - "*.pkl":
        type: file
        description: Pickled obs subset containing CyteType annotation columns
        pattern: "*.pkl"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750"

authors:
  - "@nictru"
maintainers:
  - "@nictru"
