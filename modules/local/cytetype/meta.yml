name: "cytetype"
description: Annotate cell types via the CyteType API using cluster marker genes
keywords:
  - cell-type
  - annotation
  - single-cell
  - scrnaseq
tools:
  - "cytetype":
      description: "LLM-assisted cell type annotation from marker genes"
      homepage: "https://github.com/cytetype/cytetype"
      documentation: "https://github.com/cytetype/cytetype"
      tool_dev_url: "https://github.com/cytetype/cytetype"
      licence: ["MIT"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format with cluster labels and marker ranks
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - symbol_col:
      type: string
      description: Feature metadata column containing gene symbols
  - study_context:
      type: string
      description: Free-text biological context passed to CyteType
  - group_key:
      type: string
      description: obs column with cluster or group labels to annotate
  - rank_key:
      type: string
      description: uns key containing ranked genes for each group
  - integration:
      type: string
      description: Integration or embedding context used by CyteType
  - resolution:
      type: string
      description: Clustering resolution or related CyteType parameter

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData object with CyteType annotations
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  obs:
    - "*.pkl":
        type: file
        description: Pickled observation annotations from CyteType
        pattern: "*.pkl"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
