name: "celda_decontx"
description: Remove ambient RNA contamination from single-cell counts with decontX
keywords:
  - ambient-rna
  - decontamination
  - single-cell
  - celda
tools:
  - "decontx":
      description: "decontX: Bayesian method to estimate and remove contamination in single-cell RNA-seq data"
      homepage: "https://bioconductor.org/packages/celda"
      documentation: "https://bioconductor.org/packages/release/bioc/html/celda.html"
      tool_dev_url: "https://github.com/campbio/celda"
      doi: "10.1038/s41467-020-19824-8"
      licence: ["MIT"]
      identifier: biotools:decontx

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
    - raw:
        type: file
        description: Raw counts AnnData object in h5ad format used to estimate ambient RNA profiles
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - batch_col:
      type: string
      description: Optional obs column used to split cells by batch when running decontX
  - input_layer:
      type: string
      description: AnnData layer to read counts from (`X` or a layer name)
  - output_layer:
      type: string
      description: AnnData layer name where decontaminated counts are stored

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData object with decontaminated counts in the specified output layer
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750"

authors:
  - "@nictru"
maintainers:
  - "@nictru"
