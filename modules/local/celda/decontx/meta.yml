name: "celda_decontx"
description: Remove ambient RNA contamination from single-cell counts with decontX
keywords:
  - ambient-rna
  - decontamination
  - single-cell
  - scrnaseq
tools:
  - "celda":
      description: "Bayesian hierarchical modelling of latent and composite cell populations"
      homepage: "https://bioconductor.org/packages/celda"
      documentation: "https://bioconductor.org/packages/release/bioc/vignettes/celda/inst/doc/decontX.html"
      tool_dev_url: "https://github.com/campbio/celda"
      licence: ["MIT"]
      identifier: biotools:celda

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: Filtered AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
    - raw:
        type: file
        description: Optional raw (unfiltered) AnnData object used as the ambient RNA background
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - batch_col:
      type: string
      description: Optional obs column used to run decontX per batch
  - input_layer:
      type: string
      description: AnnData layer containing raw counts (`X` or a layer name)
  - output_layer:
      type: string
      description: AnnData layer name for decontaminated counts

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData object with decontaminated counts in the output layer
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
