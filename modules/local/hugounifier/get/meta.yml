name: "hugounifier_get"
description: Compute HUGO gene symbol unification changes across AnnData objects
keywords:
  - gene-symbols
  - hugo
  - annotation
  - single-cell
tools:
  - "hugo-unifier":
      description: "Unify gene symbols across AnnData objects to HUGO nomenclature"
      homepage: "https://pypi.org/project/hugo-unifier"
      documentation: "https://pypi.org/project/hugo-unifier"
      tool_dev_url: "https://github.com/nictru/hugo-unifier"
      licence: ["MIT"]

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - names:
        type: list
        description: Sample names corresponding to each input AnnData file
    - h5ads:
        type: file
        description: AnnData objects in h5ad format to unify
        pattern: "*.{h5ad}"

output:
  changes:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.csv":
          type: file
          description: Per-sample CSV of gene symbol changes
          pattern: "*.csv"

authors:
  - "@nictru"
maintainers:
  - "@nictru"
