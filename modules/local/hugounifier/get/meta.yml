name: "hugounifier_get"
description: Compute HUGO gene symbol unification changes for one or more AnnData objects
keywords:
  - gene-symbols
  - annotation
  - single-cell
  - hugo
tools:
  - "hugo-unifier":
      description: "Unify gene symbols to HUGO nomenclature across AnnData objects"
      homepage: "https://github.com/nictru/hugo-unifier"
      documentation: "https://github.com/nictru/hugo-unifier"
      tool_dev_url: "https://github.com/nictru/hugo-unifier"
      licence: ["MIT"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - names:
        type: list
        description: Sample names corresponding to the input AnnData objects
    - h5ads:
        type: list
        description: AnnData objects in h5ad format to inspect for gene symbol unification
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"

output:
  changes:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "${meta.id}/*.csv":
          type: file
          description: CSV files listing proposed HUGO gene symbol changes per input object
          pattern: "*.csv"
          ontologies:
            - edam: "http://edamontology.org/format_3752"
  versions_hugo_unifier:
    - - ${task.process}:
          type: string
          description: The name of the process
      - hugo-unifier:
          type: string
          description: The name of the tool
      - hugo-unifier --version | grep -oP "(?<=version )[\d.]+":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - hugo-unifier:
          type: string
          description: The name of the tool
      - hugo-unifier --version | grep -oP "(?<=version )[\d.]+":
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@nictru"
maintainers:
  - "@nictru"
