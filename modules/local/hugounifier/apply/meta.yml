name: "hugounifier_apply"
description: Apply HUGO gene symbol unification changes to an AnnData object
keywords:
  - gene-symbols
  - hugo
  - annotation
  - single-cell
tools:
  - "hugo-unifier":
      description: "Unify gene symbols across AnnData objects to HUGO nomenclature"
      homepage: "https://pypi.org/project/hugo-unifier"
      documentation: "https://pypi.org/project/hugo-unifier"
      tool_dev_url: "https://github.com/nictru/hugo-unifier"
      licence: ["MIT"]

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
    - changes:
        type: file
        description: CSV of gene symbol changes from hugounifier get
        pattern: "*.{csv}"

output:
  h5ad:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.h5ad":
          type: file
          description: AnnData with unified HUGO gene symbols applied
          pattern: "*.h5ad"
  versions_hugo_unifier:
    - - process:
          type: string
          description: Nextflow process name
      - tool:
          type: string
          description: Software name
      - version:
          type: string
          description: Software version

authors:
  - "@nictru"
maintainers:
  - "@nictru"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/hugo_unifier:2a5a3fafb4d2834f
      build_id: bd-2a5a3fafb4d2834f_1
