name: "hugounifier_apply"
description: Apply HUGO gene symbol unification changes to an AnnData object
keywords:
  - gene-symbols
  - annotation
  - single-cell
  - hugo
tools:
  - "hugo-unifier":
      description: "Unify gene symbols to HUGO nomenclature across AnnData objects"
      homepage: "https://github.com/nictru/hugo-unifier"
      documentation: "https://github.com/nictru/hugo-unifier"
      tool_dev_url: "https://github.com/nictru/hugo-unifier"
      licence:
        - "MIT"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
    - changes:
        type: file
        description: CSV file listing gene symbol changes produced by hugo-unifier get
        pattern: "*.csv"
        ontologies:
          - edam: "http://edamontology.org/format_3752" # CSV
output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}.h5ad: {}
  versions_hugo_unifier:
    - - ${task.process}:
          type: string
          description: The name of the process
      - hugo-unifier:
          type: string
          description: The name of the tool
      - hugo-unifier --version | grep -oP "(?<=version )[\d.]+":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - hugo-unifier:
          type: string
          description: The name of the tool
      - hugo-unifier --version | grep -oP "(?<=version )[\d.]+":
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@nictru"
maintainers:
  - "@nictru"
