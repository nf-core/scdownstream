name: "celldex_fetchreference"
description: Download a celldex reference dataset and package it as a tar archive
keywords:
  - cell-type
  - reference
  - single-cell
  - annotation
tools:
  - "celldex":
      description: "Index of reference cell type datasets for cell type annotation"
      homepage: "https://bioconductor.org/packages/celldex"
      documentation: "https://bioconductor.org/packages/release/data/experiment/html/celldex.html"
      tool_dev_url: "https://github.com/LTLA/celldex"
      licence: ["GPL-3.0-or-later"]
      identifier: biotools:celldex

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - ref:
        type: string
        description: Name of the celldex reference to download
    - version:
        type: string
        description: Optional version of the reference dataset

output:
  tar:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.tar":
          type: file
          description: Tar archive containing the downloaded celldex reference
          pattern: "*.tar"
          ontologies:
            - edam: "http://edamontology.org/format_2573"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
