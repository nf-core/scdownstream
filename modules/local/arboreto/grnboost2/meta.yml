name: "arboreto_grnboost2"
description: Infer one gene regulatory network per group with GRNBoost2
keywords:
  - gene-regulatory-network
  - grnboost2
  - transcription-factor
  - single-cell
tools:
  - "arboreto":
      description: "Scalable gene regulatory network inference with tree-based regression, including GRNBoost2 and GENIE3"
      homepage: "https://github.com/aertslab/arboreto"
      documentation: "https://arboreto.readthedocs.io"
      tool_dev_url: "https://github.com/aertslab/arboreto"
      doi: "10.1093/bioinformatics/bty916"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, including `obs_key` with the obs column that defines the groups
    - h5ad:
        type: file
        description: AnnData object in h5ad format with counts in X
        pattern: "*.{h5ad}"
  - tfs:
      type: file
      description: Optional text file listing candidate regulator gene symbols, one per line
      pattern: "*.{txt,tsv,csv}"
  - n_top_genes:
      type: integer
      description: Number of highly variable genes used as targets
  - min_cells:
      type: integer
      description: Minimum number of cells a group needs for a network to be inferred
  - max_links:
      type: integer
      description: Maximum number of links kept per group, ranked by importance, or 0 to keep all
  - seed:
      type: integer
      description: Random seed for GRNBoost2

output:
  tsv:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.tsv":
          type: file
          description: Table with group, TF, target and importance columns
          pattern: "*.tsv"
  uns:
    - "*.parquet":
        type: file
        description: The same table as a Parquet uns fragment with an explicit __index__ column
        pattern: "*.parquet"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"

authors:
  - "@kroy3"
maintainers:
  - "@kroy3"
