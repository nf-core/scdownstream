name: "scanorama_integrate"
description: Integrate single-cell batches with Scanorama
keywords:
  - integration
  - batch-correction
  - single-cell
tools:
  - "scanorama":
      description: "Batch correction and integration of single-cell datasets"
      homepage: "https://github.com/brianhie/scanorama"
      documentation: "https://github.com/brianhie/scanorama"
      tool_dev_url: "https://github.com/brianhie/scanorama"
      licence: ["MIT"]

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
    - batch_col:
        type: string
        description: obs column with batch labels
    - input_layer:
        type: string
        description: AnnData layer to read expression from (`X` or a layer name)
    - log_normalize:
        type: boolean
        description: When true, log-normalise counts from input_layer before integration; when false, use input_layer as pre-normalised expression

output:
  h5ad:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.h5ad":
          type: file
          description: Integrated AnnData with Scanorama embedding in obsm
          pattern: "*.h5ad"
  obsm:
    - "X_*.parquet":
        type: file
        description: Integrated embedding as pickle
        pattern: "X_*.parquet"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"

authors:
  - "@nictru"
maintainers:
  - "@nictru"
