name: "scry_deviance"
description: Select highly deviant genes for integration using scry binomial deviance
keywords:
  - feature-selection
  - single-cell
  - scrnaseq
  - integration
tools:
  - "scry":
      description: "scry: Single-Cell RNA-Seq Analysis Utilities"
      homepage: "https://bioconductor.org/packages/scry"
      documentation: "https://bioconductor.org/packages/release/bioc/html/scry.html"
      tool_dev_url: "https://github.com/cole-trapnell-lab/scry"
      licence: ["GPL-3.0"]
      identifier: biotools:bioconductor-scry

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
    - n_genes:
        type: integer
        description: |
          Number of highly deviant genes to retain. If 0, defaults to 4000.
    - excluded_genes:
        type: file
        description: |
          Optional file with one gene symbol per line to exclude before feature selection.
    - batch_col:
        type: string
        description: |
          Optional column in obs / colData for batch-aware deviance feature selection.

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData object subset to highly deviant genes
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  var:
    - "*_features.parquet":
        type: file
        description: Snappy-compressed Parquet with explicit __index__ gene identifiers and <prefix>:binomial_deviance and <prefix>:highly_deviant columns, using ext.prefix or meta.id when unset
        pattern: "*_features.parquet"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
