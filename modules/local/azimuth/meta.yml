name: "azimuth"
description: Annotate cell types in an AnnData object using the Pan-human Azimuth neural network
keywords:
  - cell-type
  - annotation
  - single-cell
  - scrnaseq
tools:
  - "panhumanpy":
      description: "Automated hierarchical cell type annotation of human scRNA-seq data with the Pan-human Azimuth neural network"
      homepage: "https://github.com/satijalab/panhumanpy"
      documentation: "https://github.com/satijalab/panhumanpy"
      tool_dev_url: "https://github.com/satijalab/panhumanpy"
      licence: ["MIT"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
    - symbol_col:
        type: string
        description: Feature metadata column containing gene symbols
    - counts_layer:
        type: string
        description: AnnData layer containing raw counts (`X` or a layer name)

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "${prefix}.h5ad":
          type: file
          description: AnnData object with Pan-human Azimuth annotations and embedding
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  obs:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "${prefix}.parquet":
          type: file
          description: Parquet Pan-human Azimuth annotations with explicit __index__ cell identifiers
          pattern: "*.parquet"
  obsm:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "X_azimuth.parquet":
          type: file
          description: Parquet Pan-human Azimuth embedding with explicit __index__ cell identifiers
          pattern: "X_azimuth.parquet"
  annotation_columns:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*_annotation_columns.csv":
          type: file
          description: CSV listing annotation columns and whether they are aggregatable
          pattern: "*_annotation_columns.csv"
          ontologies:
            - edam: "http://edamontology.org/format_3752"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
