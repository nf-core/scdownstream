name: "edgepython_sc_differential"
description: Run edgePython single-cell mixed model DE for one cell-type stratum
keywords:
  - differential-expression
  - single-cell
  - edgepython
tools:
  - "edgepython":
      description: "Python implementation of edgeR-style differential expression"
      homepage: "https://github.com/pachterlab/edgePython"
      documentation: "https://github.com/pachterlab/edgePython"
      tool_dev_url: "https://github.com/pachterlab/edgePython"
      licence: ["GPL-3.0"]

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - h5ad:
        type: file
        description: Single-cell AnnData object in h5ad format
        pattern: "*.{h5ad}"
    - donor_col:
        type: string
        description: obs column with biological replicate identifiers
    - condition_col:
        type: string
        description: obs column with condition labels
    - celltype_col:
        type: string
        description: obs column with cell type or cluster labels
    - celltype_value:
        type: string
        description: Cell type stratum to test
    - reference_condition:
        type: string
        description: Reference condition level for contrasts
    - interesting_genes:
        type: file
        description: Optional CSV of gene symbols to highlight on volcano plots
        pattern: "*.{csv,tsv,txt}"

output:
  results:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_results.csv":
          type: file
          description: edgePython single-cell DE results
          pattern: "*_results.csv"
  plots:
    - "*.png":
        type: file
        description: Volcano plots for each contrast
        pattern: "*.png"
  multiqc_files:
    - "*_mqc.json":
        type: file
        description: MultiQC custom content for volcano plots
        pattern: "*_mqc.json"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"

authors:
  - "@nictru"
maintainers:
  - "@nictru"
