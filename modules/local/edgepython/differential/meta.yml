name: "edgepython_differential"
description: Run edgePython QL F-test on pseudobulk counts per cell-type stratum
keywords:
  - differential-expression
  - pseudobulk
  - edgepython
tools:
  - "edgepython":
      description: "Python implementation of edgeR-style differential expression"
      homepage: "https://github.com/pachterlab/edgePython"
      documentation: "https://github.com/pachterlab/edgePython"
      tool_dev_url: "https://github.com/pachterlab/edgePython"
      licence: ["GPL-3.0"]

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - h5ad:
        type: file
        description: Pseudobulk AnnData object in h5ad format
        pattern: "*.{h5ad}"
  - reference_condition:
      type: string
      description: Reference condition level for contrasts

output:
  results:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_results.parquet":
          type: file
          description: Standardised edgePython results per cell-type stratum in parquet format
          pattern: "*_results.parquet"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"

authors:
  - "@nictru"
maintainers:
  - "@nictru"
