name: "scvitools_scanvi"
description: Train an scANVI model or map a query onto an scVI or scANVI reference model, export the latent embedding and predict labels
keywords:
  - integration
  - batch-correction
  - label-transfer
  - scanvi
  - single-cell
tools:
  - "scvi-tools":
      description: "Deep probabilistic analysis of single-cell omics data"
      homepage: "https://scvi-tools.org"
      documentation: "https://docs.scvi-tools.org"
      tool_dev_url: "https://github.com/scverse/scvi-tools"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference model information
          e.g. `[ id:'reference' ]`
    - reference_model:
        type: file
        description: Optional scVI or scANVI reference model for query mapping
        pattern: "*.pt"
  - reference_model_type:
      type: string
      description: Type of the reference model, either `scvi` or `scanvi`
  - - label_col:
        type: string
        description: obs column containing the cell labels
    - unlabeled_category:
        type: string
        description: Label value that marks unlabelled cells
  - batch_col:
      type: string
      description: obs column containing the batch covariate
  - categorical_covariates:
      type: string
      description: Comma-separated obs columns used as categorical covariates
  - continuous_covariates:
      type: string
      description: Comma-separated obs columns used as continuous covariates
  - n_hidden:
      type: integer
      description: Number of nodes per hidden layer
  - n_layers:
      type: integer
      description: Number of hidden layers used for encoder and decoder neural networks
  - n_latent:
      type: integer
      description: Dimensionality of the latent space
  - dispersion:
      type: string
      description: Dispersion parameter mode of the model
      enum: ["gene", "gene-batch", "gene-label", "gene-cell"]
  - gene_likelihood:
      type: string
      description: Distribution used to model gene expression
      enum: ["zinb", "nb", "poisson", "normal"]
  - max_epochs:
      type: integer
      description: Maximum number of training epochs. Pass `[]` to use the scvi-tools default
  - use_observed_lib_size:
      type: boolean
      description: Whether to use the observed library size instead of learning it

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData with scANVI latent embedding and label predictions
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  model:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*_model/model.pt":
          type: file
          description: Trained scANVI model
          pattern: "*_model/model.pt"
  obs:
    - "*.parquet":
        type: file
        description: Parquet label predictions with explicit __index__ cell identifiers
        pattern: "*.parquet"
  obsm:
    - "X_*.parquet":
        type: file
        description: Parquet scANVI latent embedding matrix with explicit __index__ cell identifiers
        pattern: "X_*.parquet"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
