name: "scvitools_scvi"
description: Train an scVI model or map a query onto an scVI reference model and export the latent embedding
keywords:
  - integration
  - batch-correction
  - scvi
  - single-cell
tools:
  - "scvi-tools":
      description: "Deep probabilistic analysis of single-cell omics data"
      homepage: "https://scvi-tools.org"
      documentation: "https://docs.scvi-tools.org"
      tool_dev_url: "https://github.com/scverse/scvi-tools"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference model information
          e.g. `[ id:'reference' ]`
    - reference_model:
        type: file
        description: Optional scVI reference model for query mapping
        pattern: "*.pt"
  - batch_col:
      type: string
      description: obs column containing the batch covariate
  - categorical_covariates:
      type: string
      description: Comma-separated obs columns used as categorical covariates
  - continuous_covariates:
      type: string
      description: Comma-separated obs columns used as continuous covariates
  - n_hidden:
      type: integer
      description: Number of nodes per hidden layer
  - n_layers:
      type: integer
      description: Number of hidden layers used for encoder and decoder neural networks
  - n_latent:
      type: integer
      description: Dimensionality of the latent space
  - dispersion:
      type: string
      description: Dispersion parameter mode of the model
      enum: ["gene", "gene-batch", "gene-label", "gene-cell"]
  - gene_likelihood:
      type: string
      description: Distribution used to model gene expression
      enum: ["zinb", "nb", "poisson", "normal"]
  - max_epochs:
      type: integer
      description: Maximum number of training epochs. Pass `[]` to use the scvi-tools default
  - use_observed_lib_size:
      type: boolean
      description: Whether to use the observed library size instead of learning it

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData with scVI latent embedding
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  model:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*_model/model.pt":
          type: file
          description: Trained scVI model
          pattern: "*_model/model.pt"
  obsm:
    - "X_*.parquet":
        type: file
        description: Parquet scVI latent embedding matrix with explicit __index__ cell identifiers
        pattern: "X_*.parquet"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
