name: "dropletutils_emptydrops"
description: Distinguish cell-containing droplets from empty droplets with DropletUtils emptyDrops
keywords:
  - empty-droplets
  - cell-calling
  - single-cell
  - scrnaseq
tools:
  - "dropletutils":
      description: "Utilities for handling single-cell droplet data"
      homepage: "https://bioconductor.org/packages/DropletUtils"
      documentation: "https://bioconductor.org/packages/release/bioc/vignettes/DropletUtils/inst/doc/DropletUtils.html"
      tool_dev_url: "https://github.com/MarioniLab/DropletUtils"
      doi: "10.1186/s13059-019-1662-y"
      licence: ["GPL-3.0-only"]
      identifier: biotools:dropletutils

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: Unfiltered AnnData object in h5ad format with raw counts in `X`
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - lower:
      type: integer
      description: Total UMI count at or below which barcodes are treated as empty droplets for the ambient profile
  - fdr:
      type: float
      description: FDR threshold at or below which barcodes are called as cells

output:
  barcodes:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}_barcodes.csv:
          type: file
          description: Headerless CSV with one cell barcode per line
          pattern: "*_barcodes.csv"
          ontologies:
            - edam: "http://edamontology.org/format_3752"
  results:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}_results.csv:
          type: file
          description: Full emptyDrops result table with one row per barcode
          pattern: "*_results.csv"
          ontologies:
            - edam: "http://edamontology.org/format_3752"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
