name: scconcept_embed
description: Embed human single cells using a pretrained scConcept checkpoint.
keywords:
  - single-cell
  - embeddings
  - transcriptomics
tools:
  - scconcept:
      description: Contrastive pretraining for single-cell transcriptomic representations.
      homepage: https://github.com/theislab/scConcept
      documentation: https://scconcept.readthedocs.io/
      tool_dev_url: https://github.com/theislab/scConcept
      doi: "10.1101/2025.10.14.682419"
      licence: ["MIT"]
input:
  - - meta:
        type: map
        description: Metadata containing the input identifier.
    - h5ad:
        type: file
        description: AnnData with human gene symbols or Ensembl IDs and counts in X.
        pattern: "*.h5ad"
  - - model_meta:
        type: map
        description: Metadata containing the model identifier.
    - config:
        type: file
        description: Pinned scConcept model configuration.
        pattern: "config.yaml"
    - checkpoint:
        type: file
        description: Pinned scConcept model checkpoint.
        pattern: "model.ckpt"
    - vocabulary:
        type: file
        description: Pinned human gene vocabulary.
        pattern: "hsapiens.csv"
output:
  h5ad:
    - - meta:
          type: map
          description: Metadata containing the input identifier.
      - "${prefix}.h5ad":
          type: file
          description: AnnData with cell embeddings in obsm["X_emb"].
          pattern: "*.h5ad"
  obsm:
    - "X_${prefix}.parquet":
        type: file
        description: Cell embeddings indexed by cell barcode.
        pattern: "X_*.parquet"
  versions_scconcept:
    - - ${task.process}:
          type: string
          description: Process name.
      - sc-concept:
          type: string
          description: Package name.
      - 'python -c "from importlib.metadata import version; print(version(''sc-concept''))"':
          type: eval
          description: Installed scConcept version.
  versions_torch:
    - - ${task.process}:
          type: string
          description: Process name.
      - torch:
          type: string
          description: Package name.
      - 'python -c "from importlib.metadata import version; print(version(''torch''))"':
          type: eval
          description: Installed PyTorch version.
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name.
      - sc-concept:
          type: string
          description: Package name.
      - 'python -c "from importlib.metadata import version; print(version(''sc-concept''))"':
          type: eval
          description: Installed scConcept version.
    - - ${task.process}:
          type: string
          description: Process name.
      - torch:
          type: string
          description: Package name.
      - 'python -c "from importlib.metadata import version; print(version(''torch''))"':
          type: eval
          description: Installed PyTorch version.
