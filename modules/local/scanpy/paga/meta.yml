name: "scanpy_paga"
description: Run partition-based graph abstraction on clustered single-cell data
keywords:
  - trajectory
  - paga
  - single-cell
  - scanpy
tools:
  - "scanpy":
      description: "Single-cell analysis in Python"
      homepage: "https://scanpy.readthedocs.io"
      documentation: "https://scanpy.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/scanpy"
      licence:
        - "BSD-3-Clause"
      identifier: biotools:scanpy
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format with a neighbour graph and cluster labels in obs
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData object with PAGA results stored in uns and obsp
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  uns:
    - "*.pkl":
        type: file
        description: Pickled uns contents including PAGA graph and layout
        pattern: "*.pkl"
        ontologies: []
  obsp:
    - "*.npy":
        type: file
        description: PAGA connectivities matrix saved as NumPy array
        pattern: "*.npy"
        ontologies:
          - edam: http://edamontology.org/format_4003 # NumPy format
  plot:
    - "*.png":
        type: file
        description: PAGA graph plot
        pattern: "*.png"
        ontologies: []
  multiqc_files:
    - "*_mqc.json":
        type: file
        description: MultiQC custom content JSON for the PAGA plot
        pattern: "*_mqc.json"
        ontologies:
          - edam: http://edamontology.org/format_3464 # JSON
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
topics:
  versions:
    - versions.yml:
        type: string
        description: The name of the process
authors:
  - "@nictru"
maintainers:
  - "@nictru"
