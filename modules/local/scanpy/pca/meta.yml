name: "scanpy_pca"
description: Run principal component analysis with Scanpy and export embeddings
keywords:
  - pca
  - dimensionality-reduction
  - scanpy
  - single-cell
tools:
  - "scanpy":
      description: "Single-cell analysis in Python"
      homepage: "https://scanpy.readthedocs.io"
      documentation: "https://scanpy.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/scanpy"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
  - key_added:
      type: string
      description: obsm key used to store the PCA embedding
  - input_layer:
      type: string
      description: AnnData layer to use as input expression
  - log_normalize:
      type: boolean
      description: Whether to log-normalise the input layer before PCA

output:
  h5ad:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.h5ad":
          type: file
          description: AnnData with PCA results
          pattern: "*.h5ad"
  obsm:
    - "X_*.pkl":
        type: file
        description: Pickled PCA embedding matrix
        pattern: "X_*.pkl"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"

authors:
  - "@nictru"
maintainers:
  - "@nictru"
