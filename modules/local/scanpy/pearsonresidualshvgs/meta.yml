name: "scanpy_pearsonresidualshvgs"
description: Select highly variable genes using analytic Pearson residuals on raw counts
keywords:
  - feature-selection
  - single-cell
  - scrnaseq
  - scanpy
tools:
  - "scanpy":
      description: "Single-Cell Analysis in Python"
      homepage: "https://scanpy.readthedocs.io/"
      documentation: "https://scanpy.readthedocs.io/"
      tool_dev_url: "https://github.com/scverse/scanpy"
      licence: ["BSD-3-clause"]
      identifier: biotools:scanpy

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format with selected analysis counts in `X`
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
    - n_genes:
        type: integer
        description: |
          Number of highly variable genes to retain. If 0, defaults to 4000.
    - excluded_genes:
        type: file
        description: |
          Optional file with one gene symbol per line to exclude before feature selection.
    - batch_key:
        type: string
        description: |
          Optional column in obs for batch-aware Pearson residual HVG selection.
    - counts_layer:
        type: string
        description: |
          Layer containing raw counts, or `X` to use the main matrix.

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData object subset to highly variable genes with raw counts in `X`
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  var:
    - "*.parquet":
        type: file
        description: Snappy-compressed Parquet HVG flags with explicit __index__ gene identifiers and the column named by ext.prefix, or meta.id when unset
        pattern: "*.parquet"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
