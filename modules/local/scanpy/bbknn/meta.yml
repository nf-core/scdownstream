name: "scanpy_bbknn"
description: Compute a batch-balanced k-nearest neighbours graph with BBKNN
keywords:
  - batch-correction
  - neighbours
  - single-cell
  - bbknn
tools:
  - "bbknn":
      description: "Batch-balanced k-nearest neighbours for single-cell data"
      homepage: "https://github.com/Teichlab/bbknn"
      documentation: "https://github.com/Teichlab/bbknn"
      tool_dev_url: "https://github.com/Teichlab/bbknn"
      licence: ["MIT"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - batch_col:
      type: string
      description: obs column with batch labels used for batch-balanced neighbour search
  - input_layer:
      type: string
      description: AnnData layer to read expression from (`X` or a layer name)
  - log_normalize:
      type: boolean
      description: When true, log-normalise counts from input_layer before computing neighbours; when false, use input_layer as pre-normalised expression

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData object with BBKNN neighbour graph stored in obsp
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
