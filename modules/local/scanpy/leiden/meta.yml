name: "scanpy_leiden"
description: Cluster cells with the Leiden algorithm and optionally plot UMAP coloured by clusters
keywords:
  - clustering
  - leiden
  - single-cell
  - scanpy
tools:
  - "scanpy":
      description: "Single-cell analysis in Python"
      homepage: "https://scanpy.readthedocs.io"
      documentation: "https://scanpy.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/scanpy"
      licence:
        - "BSD-3-Clause"
      identifier: biotools:scanpy
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format with a neighbour graph in obsp
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - resolution:
      type: number
      description: Leiden clustering resolution parameter
  - key_added:
      type: string
      description: obs column name for cluster labels
  - plot_umap:
      type: boolean
      description: When true, generate a UMAP plot coloured by cluster labels and MultiQC JSON

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}.h5ad: {}
  obs:
    - ${prefix}.parquet: {}
  plots:
    - ${prefix}.png: {}
  multiqc_files:
    - ${prefix}_mqc.json: {}
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
topics:
  versions:
    - versions.yml:
        type: string
        description: The name of the process
authors:
  - "@nictru"
maintainers:
  - "@nictru"
