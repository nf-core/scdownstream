name: "scanpy_leiden"
description: Cluster cells with the Leiden algorithm and optionally plot UMAP coloured by clusters
keywords:
  - clustering
  - leiden
  - single-cell
  - scanpy
tools:
  - "scanpy":
      description: "Single-cell analysis in Python"
      homepage: "https://scanpy.readthedocs.io"
      documentation: "https://scanpy.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/scanpy"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format with a neighbour graph in obsp
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - resolution:
      type: number
      description: Leiden clustering resolution parameter
  - key_added:
      type: string
      description: obs column name for cluster labels
  - plot_umap:
      type: boolean
      description: When true, generate a UMAP plot coloured by cluster labels and MultiQC JSON

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData object with Leiden cluster labels in obs
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  obs:
    - "*.pkl":
        type: file
        description: Pickled obs subset containing cluster labels
        pattern: "*.pkl"
  plots:
    - "*.png":
        type: file
        description: UMAP plot coloured by Leiden clusters
        pattern: "*.png"
  multiqc_files:
    - "*_mqc.json":
        type: file
        description: MultiQC custom content JSON for the Leiden UMAP plot
        pattern: "*_mqc.json"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
