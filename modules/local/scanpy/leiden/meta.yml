name: "scanpy_leiden"
description: Cluster cells with the Leiden algorithm and optionally plot UMAP
keywords:
  - clustering
  - leiden
  - scanpy
  - single-cell
tools:
  - "scanpy":
      description: "Single-cell analysis in Python"
      homepage: "https://scanpy.readthedocs.io"
      documentation: "https://scanpy.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/scanpy"
      licence: ["BSD-3-Clause"]
  - "leidenalg":
      description: "Leiden community detection algorithm"
      homepage: "https://github.com/vtraag/leidenalg"
      documentation: "https://leidenalg.readthedocs.io"
      tool_dev_url: "https://github.com/vtraag/leidenalg"
      licence: ["GPL-3.0-or-later"]

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - h5ad:
        type: file
        description: AnnData object in h5ad format with a neighbour graph
        pattern: "*.{h5ad}"
  - resolution:
      type: number
      description: Leiden clustering resolution
  - key_added:
      type: string
      description: obs column name for cluster labels
  - plot_umap:
      type: boolean
      description: Whether to write a UMAP coloured by clusters

output:
  h5ad:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.h5ad":
          type: file
          description: AnnData with Leiden cluster labels
          pattern: "*.h5ad"
  obs:
    - "*.pkl":
        type: file
        description: Pickled obs with Leiden cluster labels
        pattern: "*.pkl"
  plots:
    - "*.png":
        type: file
        description: Optional UMAP plot coloured by clusters
        pattern: "*.png"
  multiqc_files:
    - "*_mqc.json":
        type: file
        description: Optional MultiQC custom content for the UMAP plot
        pattern: "*_mqc.json"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"

authors:
  - "@nictru"
maintainers:
  - "@nictru"
