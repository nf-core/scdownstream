name: scanpy_combat
description: Remove batch effects from expression data using Scanpy ComBat
keywords:
  - batch-correction
  - integration
  - single-cell
  - scanpy
tools:
  - scanpy:
      description: Single-cell analysis in Python
      homepage: https://scanpy.readthedocs.io
      documentation: https://scanpy.readthedocs.io
      tool_dev_url: https://github.com/scverse/scanpy
      licence:
        - BSD-3-Clause
      identifier: biotools:scanpy
input:
  - - meta:
        type: map
        description: "Groovy Map containing sample information

          e.g. `[ id:'sample1' ]`

          "
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: http://edamontology.org/format_3590
  - batch_col:
      type: string
      description: obs column with batch labels used for ComBat correction
  - input_layer:
      type: string
      description: AnnData layer to read expression from (`X` or a layer name)
  - log_normalize:
      type: boolean
      description: When true, log-normalise counts from input_layer before ComBat; when false, use input_layer as pre-normalised expression
output:
  h5ad:
    - - meta:
          type: map
          description: "Groovy Map containing sample information

            e.g. `[ id:'sample1' ]`

            "
      - "*.h5ad":
          type: file
          description: AnnData object with batch-corrected expression
          pattern: "*.h5ad"
          ontologies:
            - edam: http://edamontology.org/format_3590
  obsm:
    - "*.parquet":
        type: file
        description: Pickled batch-corrected expression matrix stored in obsm
        pattern: "*.parquet"
        ontologies: []
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
        ontologies:
          - edam: http://edamontology.org/format_3750
topics:
  versions:
    - versions.yml:
        type: string
        description: The name of the process
authors:
  - "@nictru"
maintainers:
  - "@nictru"
