name: "scanpy_combat"
description: Correct batch effects with Scanpy ComBat and store corrected embeddings
keywords:
  - batch-correction
  - combat
  - scanpy
  - single-cell
tools:
  - "scanpy":
      description: "Single-cell analysis in Python"
      homepage: "https://scanpy.readthedocs.io"
      documentation: "https://scanpy.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/scanpy"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
  - batch_col:
      type: string
      description: obs column identifying batches
  - input_layer:
      type: string
      description: AnnData layer to use as input expression
  - log_normalize:
      type: boolean
      description: Whether to log-normalise the input layer before ComBat

output:
  h5ad:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.h5ad":
          type: file
          description: AnnData with ComBat-corrected data
          pattern: "*.h5ad"
  obsm:
    - "X_*.parquet":
        type: file
        description: Parquet ComBat embedding with explicit __index__ cell identifiers
        pattern: "X_*.parquet"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"

authors:
  - "@nictru"
maintainers:
  - "@nictru"
