name: "scanpy_cellcycle"
description: Score and regress cell cycle phase effects using S and G2M gene sets
keywords:
  - cell-cycle
  - quality-control
  - single-cell
  - scanpy
tools:
  - "scanpy":
      description: "Single-cell analysis in Python"
      homepage: "https://scanpy.readthedocs.io"
      documentation: "https://scanpy.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/scanpy"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - s_genes:
      type: file
      description: File listing S-phase gene symbols, one per line
      pattern: "*.{txt,tsv,csv}"
  - g2m_genes:
      type: file
      description: File listing G2M-phase gene symbols, one per line
      pattern: "*.{txt,tsv,csv}"
  - symbol_col:
      type: string
      description: var column containing gene symbols used to match cell cycle gene lists

output:
  obs:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.pkl":
          type: file
          description: Pickled obs subset with cell cycle scores and phase labels
          pattern: "*.pkl"
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData object with cell cycle scores regressed from expression
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  multiqc_files:
    - "*_mqc.json":
        type: file
        description: MultiQC custom content JSON for cell cycle score plots
        pattern: "*_mqc.json"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
