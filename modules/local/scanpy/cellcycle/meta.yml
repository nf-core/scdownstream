name: "scanpy_cellcycle"
description: Score cell cycle phases with Scanpy using S and G2/M gene lists
keywords:
  - cell-cycle
  - scanpy
  - single-cell
tools:
  - "scanpy":
      description: "Single-cell analysis in Python"
      homepage: "https://scanpy.readthedocs.io"
      documentation: "https://scanpy.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/scanpy"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
  - s_genes:
      type: file
      description: Text file listing S-phase marker genes
      pattern: "*.{txt,tsv,csv}"
  - g2m_genes:
      type: file
      description: Text file listing G2/M-phase marker genes
      pattern: "*.{txt,tsv,csv}"
  - symbol_col:
      type: string
      description: var column containing gene symbols

output:
  obs:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.parquet":
          type: file
          description: Parquet obs with cell cycle scores and an explicit __index__ column
          pattern: "*.parquet"
  h5ad:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.h5ad":
          type: file
          description: AnnData with cell cycle annotations
          pattern: "*.h5ad"
  multiqc_files:
    - "*_mqc.json":
        type: file
        description: MultiQC custom content JSON for cell cycle plots
        pattern: "*_mqc.json"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"

authors:
  - "@nictru"
maintainers:
  - "@nictru"
