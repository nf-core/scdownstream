name: "scanpy_hvgs"
description: Identify highly variable genes with Scanpy and store updated var
keywords:
  - highly-variable-genes
  - scanpy
  - single-cell
tools:
  - "scanpy":
      description: "Single-cell analysis in Python"
      homepage: "https://scanpy.readthedocs.io"
      documentation: "https://scanpy.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/scanpy"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
  - n_hvgs:
      type: integer
      description: Number of highly variable genes to select
  - excluded_genes:
      type: file
      description: Optional gene list to exclude from HVG selection
      pattern: "*.{txt,tsv,csv}"
  - input_layer:
      type: string
      description: AnnData layer to use as input expression
  - log_normalize:
      type: boolean
      description: Whether to log-normalise the input layer before HVG selection
  - batch_key:
      type: string
      description: obs column holding batch labels for batch-aware HVG selection. An empty string disables it.

output:
  h5ad:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.h5ad":
          type: file
          description: AnnData with highly variable gene annotations
          pattern: "*.h5ad"
  var:
    - "*.parquet":
        type: file
        description: Snappy-compressed Parquet HVG flags with explicit __index__ gene identifiers and the column named by ext.prefix, or meta.id when unset
        pattern: "*.parquet"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"

authors:
  - "@nictru"
maintainers:
  - "@nictru"
