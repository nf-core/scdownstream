name: "scanpy_hvgs"
description: Select highly variable genes using Scanpy highly_variable_genes
keywords:
  - feature-selection
  - highly-variable-genes
  - single-cell
  - scanpy
tools:
  - "scanpy":
      description: "Single-cell analysis in Python"
      homepage: "https://scanpy.readthedocs.io"
      documentation: "https://scanpy.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/scanpy"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - n_hvgs:
      type: integer
      description: Number of highly variable genes to retain
  - excluded_genes:
      type: file
      description: File with one gene symbol per line to exclude before feature selection
      pattern: "*.{txt,tsv,csv}"
  - input_layer:
      type: string
      description: AnnData layer to read expression from (`X` or a layer name)
  - log_normalize:
      type: boolean
      description: When true, log-normalise counts from input_layer before HVG selection; when false, use input_layer as pre-normalised expression

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData object subset to highly variable genes
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  var:
    - "*.pkl":
        type: file
        description: Pickled DataFrame with highly variable gene annotations
        pattern: "*.pkl"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
