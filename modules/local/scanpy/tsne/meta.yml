name: scanpy_tsne
description: Compute t-SNE embedding from a neighbour graph using Scanpy
keywords:
  - dimensionality-reduction
  - tsne
  - single-cell
  - scanpy
tools:
  - scanpy:
      description: Single-cell analysis in Python
      homepage: https://scanpy.readthedocs.io
      documentation: https://scanpy.readthedocs.io
      tool_dev_url: https://github.com/scverse/scanpy
      licence:
        - BSD-3-Clause
      identifier: biotools:scanpy
input:
  - - meta:
        type: map
        description: "Groovy Map containing sample information

          e.g. `[ id:'sample1' ]`

          "
    - h5ad:
        type: file
        description: AnnData object in h5ad format with a neighbour graph in obsp
        pattern: "*.{h5ad}"
        ontologies:
          - edam: http://edamontology.org/format_3590
output:
  h5ad:
    - - meta:
          type: map
          description: "Groovy Map containing sample information

            e.g. `[ id:'sample1' ]`

            "
      - ${prefix}.h5ad: {}
  obsm:
    - X_${prefix}.parquet: {}
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
        ontologies:
          - edam: http://edamontology.org/format_3750
topics:
  versions:
    - versions.yml:
        type: string
        description: The name of the process
authors:
  - "@nictru"
maintainers:
  - "@nictru"
