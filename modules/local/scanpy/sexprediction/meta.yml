name: "scanpy_sexprediction"
description: Predict the sex of each sample from Y chromosome and X-inactivation gene counts
keywords:
  - sex
  - xist
  - quality-control
  - single-cell
tools:
  - "scanpy":
      description: "Single-cell analysis in Python"
      homepage: "https://scanpy.readthedocs.io"
      documentation: "https://scanpy.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/scanpy"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - h5ad:
        type: file
        description: AnnData object in h5ad format with raw counts in X
        pattern: "*.{h5ad}"
  - y_genes:
      type: file
      description: Text file listing genes from the male-specific region of chromosome Y
      pattern: "*.{txt,tsv,csv}"
  - x_genes:
      type: file
      description: Text file listing X-inactivation genes such as XIST
      pattern: "*.{txt,tsv,csv}"
  - symbol_col:
      type: string
      description: var column containing gene symbols

output:
  obs:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.parquet":
          type: file
          description: Parquet obs with per-cell sex marker fractions, per-cell calls, the sample call and an explicit __index__ column
          pattern: "*.parquet"
  h5ad:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.h5ad":
          type: file
          description: AnnData with sex prediction annotations
          pattern: "*.h5ad"
  tsv:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.tsv":
          type: file
          description: One-row summary of the sample-level sex prediction
          pattern: "*.tsv"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"

authors:
  - "@kroy3"
maintainers:
  - "@kroy3"
