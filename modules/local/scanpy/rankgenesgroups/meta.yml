name: "scanpy_rankgenesgroups"
description: Run Scanpy rank_genes_groups differential expression and volcano plots
keywords:
  - differential-expression
  - scanpy
  - single-cell
tools:
  - "scanpy":
      description: "Single-cell analysis in Python"
      homepage: "https://scanpy.readthedocs.io"
      documentation: "https://scanpy.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/scanpy"
      licence:
        - "BSD-3-Clause"
      identifier: biotools:scanpy
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies: []
  - obs_key:
      type: string
      description: obs column used to group cells for differential expression
  - - filter_col:
        type: string
        description: Optional obs column used to subset cells before DE
    - filter_val:
        type: string
        description: Optional value of filter_col to retain
  - method:
      type: string
      description: Scanpy rank_genes_groups statistical method
  - rank_key:
      type: string
      description: uns key for rank_genes_groups results
  - interesting_genes:
      type: file
      description: Optional CSV of gene symbols to highlight on volcano plots
      pattern: "*.{csv,tsv,txt}"

      ontologies:
        - edam: http://edamontology.org/format_3752 # CSV
        - edam: http://edamontology.org/format_3475 # TSV
output:
  h5ad:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.h5ad":
          type: file
          description: AnnData with rank_genes_groups results
          pattern: "*.h5ad"
          ontologies: []
  uns:
    - "*.pkl":
        type: file
        description: Pickled uns contents including rank_genes_groups
        pattern: "*.pkl"
        ontologies: []
  plots:
    - "*.png":
        type: file
        description: Differential expression plots including volcanoes
        pattern: "*.png"
        ontologies: []
  markers:
    - "*.csv":
        type: file
        description: Marker gene tables
        pattern: "*.csv"
        ontologies:
          - edam: http://edamontology.org/format_3752 # CSV
  multiqc_files:
    - "*_mqc.json":
        type: file
        description: MultiQC custom content JSON for volcano plots
        pattern: "*_mqc.json"
        ontologies:
          - edam: http://edamontology.org/format_3464 # JSON
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"

        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
topics:
  versions:
    - versions.yml:
        type: string
        description: The name of the process
authors:
  - "@nictru"
maintainers:
  - "@nictru"
