name: "scanpy_rankgenesgroups"
description: Run Scanpy rank_genes_groups differential expression
keywords:
  - differential-expression
  - scanpy
  - single-cell
tools:
  - "scanpy":
      description: "Single-cell analysis in Python"
      homepage: "https://scanpy.readthedocs.io"
      documentation: "https://scanpy.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/scanpy"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
  - obs_key:
      type: string
      description: obs column used to group cells for differential expression
  - - filter_col:
        type: string
        description: Optional obs column used to subset cells before DE
    - filter_val:
        type: string
        description: Optional value of filter_col to retain
  - method:
      type: string
      description: Scanpy rank_genes_groups statistical method
  - rank_key:
      type: string
      description: uns key for rank_genes_groups results

output:
  h5ad:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.h5ad":
          type: file
          description: AnnData with rank_genes_groups results
          pattern: "*.h5ad"
  uns:
    - "*.pkl":
        type: file
        description: Pickled uns contents including rank_genes_groups
        pattern: "*.pkl"
  plots:
    - "*.png":
        type: file
        description: Rank gene and dot plots
        pattern: "*.png"
  markers:
    - "*.csv":
        type: file
        description: Marker gene tables
        pattern: "*.csv"
  results:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_results.parquet":
          type: file
          description: Standardised differential expression results in parquet format
          pattern: "*_results.parquet"
  multiqc_files:
    - "*_mqc.json":
        type: file
        description: MultiQC custom content JSON for rank gene and dot plots
        pattern: "*_mqc.json"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"

authors:
  - "@nictru"
maintainers:
  - "@nictru"
