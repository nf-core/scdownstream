name: "scanpy_plotqc"
description: Generate Scanpy quality control plots and MultiQC custom content
keywords:
  - quality-control
  - plotting
  - scanpy
  - single-cell
tools:
  - "scanpy":
      description: "Single-cell analysis in Python"
      homepage: "https://scanpy.readthedocs.io"
      documentation: "https://scanpy.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/scanpy"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
  - symbol_col:
      type: string
      description: var column containing gene symbols
  - mito_genes:
      type: file
      description: Optional list of mitochondrial gene symbols
      pattern: "*.{txt,tsv,csv}"
  - section_name:
      type: string
      description: Name of the MultiQC section that groups the plots

output:
  plots:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.png":
          type: file
          description: Quality control plots
          pattern: "*.png"
  multiqc_files:
    - "*_mqc.json":
        type: file
        description: MultiQC custom content JSON for QC plots
        pattern: "*_mqc.json"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"

authors:
  - "@nictru"
maintainers:
  - "@nictru"
