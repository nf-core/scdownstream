name: "custom_aggregate_per_cell_annotations"
description: Aggregate per-cell annotations to cluster-level majority labels
keywords:
  - annotation
  - aggregation
  - single-cell
  - scanpy
tools:
  - "scanpy":
      description: "Single-cell analysis in Python"
      homepage: "https://scanpy.readthedocs.io"
      documentation: "https://scanpy.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/scanpy"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - h5ad:
        type: file
        description: AnnData object in h5ad format with per-cell annotations
        pattern: "*.{h5ad}"
  - cluster_col:
      type: string
      description: obs column with cluster labels used for aggregation
  - annotation_col:
      type: string
      description: obs column with per-cell annotations to aggregate
  - integration:
      type: string
      description: Integration method name used in the output column label
  - resolution:
      type: string
      description: Clustering resolution used in the output column label

output:
  h5ad:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.h5ad":
          type: file
          description: AnnData with aggregated annotation column added to obs
          pattern: "*.h5ad"
  obs:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.parquet":
          type: file
          description: Parquet obs table including aggregated annotations and an explicit __index__ column
          pattern: "*.parquet"
  aggregate_per_cell_annotations:
    - "*_aggregate_per_cell_annotations.csv":
        type: file
        description: Optional per-cluster aggregation summary table
        pattern: "*_aggregate_per_cell_annotations.csv"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"

authors:
  - "@nictru"
maintainers:
  - "@nictru"
