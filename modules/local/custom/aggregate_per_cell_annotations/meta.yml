name: "custom_aggregate_per_cell_annotations"
description: Aggregate per-cell annotation labels within clusters and write summary columns to obs
keywords:
  - annotation
  - aggregation
  - single-cell
  - clustering
tools:
  - "scanpy":
      description: "Single-cell analysis in Python"
      homepage: "https://scanpy.readthedocs.io"
      documentation: "https://scanpy.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/scanpy"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - cluster_col:
      type: string
      description: obs column containing cluster assignments used for aggregation
  - annotation_col:
      type: string
      description: obs column containing per-cell annotation labels to aggregate
  - integration:
      type: string
      description: obsm key used for neighbourhood graph construction before clustering
  - resolution:
      type: number
      description: Leiden clustering resolution when cluster_col is derived within the module

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData object with aggregated annotation columns added to obs
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  obs:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.pkl":
          type: file
          description: Pickled obs subset containing aggregated annotation columns
          pattern: "*.pkl"
  aggregate_per_cell_annotations:
    - "*_aggregate_per_cell_annotations.csv":
        type: file
        description: Optional CSV summarising aggregated annotation counts per cluster
        pattern: "*_aggregate_per_cell_annotations.csv"
        ontologies:
          - edam: "http://edamontology.org/format_3752"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750"

authors:
