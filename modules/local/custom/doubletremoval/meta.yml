name: "custom_doubletremoval"
description: Filter or flag predicted doublets in an AnnData object using scDblFinder predictions
keywords:
  - doublet-removal
  - quality-control
  - single-cell
  - filtering
tools:
  - "scanpy":
      description: "Single-cell analysis in Python"
      homepage: "https://scanpy.readthedocs.io"
      documentation: "https://scanpy.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/scanpy"
      licence:
        - "BSD-3-Clause"
      identifier: biotools:scanpy
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
    - predictions:
        type: file
        description: CSV file containing doublet predictions from scDblFinder
        pattern: "*.csv"
        ontologies:
          - edam: "http://edamontology.org/format_3752" # CSV
  - threshold:
      type: number
      description: Score threshold above which cells are classified as doublets
  - removal:
      type: boolean
      description: When true, remove predicted doublets; when false, annotate them in obs only

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData object with doublet annotations or with doublets removed
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  multiqc_files:
    - "*_mqc.json":
        type: file
        description: Optional MultiQC custom content JSON summarising doublet removal
        pattern: "*_mqc.json"
        ontologies:
          - edam: http://edamontology.org/format_3464 # JSON
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
topics:
  versions:
    - versions.yml:
        type: string
        description: The name of the process
authors:
  - "@nictru"
maintainers:
  - "@nictru"
