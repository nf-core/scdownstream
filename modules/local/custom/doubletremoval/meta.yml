name: "custom_doubletremoval"
description: Validate doublet predictions and score coverage, emit method-scoped calls and optionally remove doublets
keywords:
  - doublets
  - filtering
  - single-cell
  - qc
tools:
  - "anndata":
      description: "Annotated data matrices for single-cell analysis"
      homepage: "https://anndata.readthedocs.io"
      documentation: "https://anndata.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/anndata"
      licence: ["BSD-3-Clause"]
  - "upsetplot":
      description: "Python package for drawing UpSet plots of set intersections"
      homepage: "https://upsetplot.readthedocs.io"
      documentation: "https://upsetplot.readthedocs.io"
      tool_dev_url: "https://github.com/jnothman/UpSetPlot"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
    - methods:
        type: list
        description: Sorted unique method identifiers aligned with predictions (doubletdetection, scdblfinder, scrublet, solo)
    - predictions:
        type: file
        description: Doublet prediction tables in CSV or pickle format
        pattern: "*.{csv,pkl}"
    - scores:
        type: file
        description: Optional detector score tables in CSV or pickle format, covering every input cell exactly once before removal
        pattern: "*.{csv,pkl}"
  - threshold:
      type: integer
      description: Minimum number of positive doublet calls required to flag a cell
  - removal:
      type: string
      description: Whether to remove flagged doublets (true) or retain all cells (false)

output:
  h5ad:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.h5ad":
          type: file
          description: Original AnnData with only optional cell filtering applied, without newly computed annotations
          pattern: "*.h5ad"
  obs:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.obs.pkl":
          type: file
          description: Full-cell indexed method-scoped Boolean calls and classes; no scores
          pattern: "*.obs.pkl"
  multiqc_files:
    - "*_mqc.json":
        type: file
        description: Optional MultiQC custom content JSON with UpSet plot
        pattern: "*_mqc.json"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"

authors:
  - "@nictru"
maintainers:
  - "@nictru"
