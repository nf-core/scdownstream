name: "custom_collectsizes"
description: Collect per-sample cell counts across pipeline filtering stages and emit MultiQC content
keywords:
  - quality-control
  - single-cell
  - multiqc
  - cell-counts
tools:
  - "pandas":
      description: "Powerful data structures for data analysis in Python"
      homepage: "https://pandas.pydata.org"
      documentation: "https://pandas.pydata.org/docs"
      tool_dev_url: "https://github.com/pandas-dev/pandas"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - sizes:
        type: file
        description: Tab-separated file listing cell counts per filtering stage
        pattern: "*.{tsv,txt}"
        ontologies:
          - edam: "http://edamontology.org/format_3475"

output:
  tsv:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.tsv":
          type: file
          description: Pivot table of cell counts per sample and filtering stage
          pattern: "*.tsv"
          ontologies:
            - edam: "http://edamontology.org/format_3475"
  multiqc_files:
    - "*_mqc.json":
        type: file
        description: MultiQC custom content JSON for the cell count table
        pattern: "*_mqc.json"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750"

authors:
  - "@nictru"
maintainers:
  - "@nictru"
