name: "custom_volcanoplot"
description: Draw volcano plots and MultiQC image sections from standardised differential expression parquet tables
keywords:
  - differential-expression
  - volcano
  - multiqc
tools:
  - "matplotlib":
      description: "Comprehensive library for creating static, animated, and interactive visualisations in Python"
      homepage: "https://matplotlib.org"
      documentation: "https://matplotlib.org/stable/users/index.html"
      tool_dev_url: "https://github.com/matplotlib/matplotlib"
      licence: ["PSF-2.0"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information.
          Expected keys: id, integration, de_method.
    - parquet:
        type: file
        description: |
          Standardised DE results parquet with columns gene, log2fc, pvalue, padj,
          group, contrast, and stratum
        pattern: "*.{parquet}"
  - interesting_genes:
      type: file
      description: Optional CSV of gene symbols to highlight on volcano plots
      pattern: "*.{csv,tsv,txt}"

output:
  plots:
    - "*.png":
        type: file
        description: Volcano plot PNG derived from the parquet stem
        pattern: "*.png"
  multiqc_files:
    - "*_mqc.json":
        type: file
        description: MultiQC custom-content JSON embedding the volcano image
        pattern: "*_mqc.json"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"

authors:
  - "@nictru"
maintainers:
  - "@nictru"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/custom_volcanoplot:2e9b936eb387e94b
