name: "adata_setindex"
description: Set the AnnData obs or var index from an existing column
keywords:
  - anndata
  - index
  - single-cell
tools:
  - "anndata":
      description: "Annotated data matrices in Python"
      homepage: "https://anndata.readthedocs.io"
      documentation: "https://anndata.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/anndata"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - axis:
      type: string
      description: Axis to reindex, either `obs` or `var`
  - column:
      type: string
      description: Column name used as the new index

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData with the updated index on the chosen axis
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
