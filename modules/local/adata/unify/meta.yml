name: "adata_unify"
description: Standardise AnnData metadata, gene symbols, and expression matrix for downstream integration
keywords:
  - single-cell
  - anndata
  - integration
  - harmonisation
  - metadata
tools:
  - "anndata":
      description: "An annotated data matrix"
      homepage: "https://anndata.readthedocs.io"
      documentation: "https://anndata.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/anndata"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - batch_col:
      type: string
      description: obs column to map to the standard batch column
  - label_col:
      type: string
      description: obs column to map to the standard label column
  - condition_col:
      type: string
      description: obs column to map to the standard condition column
  - unknown_label:
      type: string
      description: Value in label_col to replace with unknown
  - symbol_col:
      type: string
      description: var column or index to use as gene symbols
  - counts_layer:
      type: string
      description: Layer to promote to X before harmonisation, or X to use the main matrix
  - duplicate_var_resolution:
      type: string
      description: Method for resolving duplicate gene symbols, such as mean, sum, max, or make_unique
  - aggregate_isoforms:
      type: string
      description: Whether to aggregate isoform suffixes in gene symbols before deduplication
  - donor_col:
      type: string
      description: obs column to map to the standard donor column

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: Harmonised AnnData object with standardised obs columns and gene symbols
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
