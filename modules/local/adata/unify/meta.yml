name: "adata_unify"
description: Standardise AnnData metadata, gene symbols and counts for downstream analysis
keywords:
  - anndata
  - preprocessing
  - single-cell
tools:
  - "anndata":
      description: "Annotated data matrices in Python"
      homepage: "https://anndata.readthedocs.io"
      documentation: "https://anndata.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/anndata"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - batch_col:
      type: string
      description: obs column used as the batch identifier
  - label_col:
      type: string
      description: obs column used as the cell-type label
  - condition_col:
      type: string
      description: obs column used as the experimental condition
  - unknown_label:
      type: string
      description: Label value treated as unknown or missing
  - symbol_col:
      type: string
      description: var column containing gene symbols, or `index`
  - counts_layer:
      type: string
      description: Layer or `X` containing raw counts
  - duplicate_var_resolution:
      type: string
      description: Strategy for resolving duplicated variable names
  - aggregate_isoforms:
      type: boolean
      description: Whether to aggregate gene isoforms into a single variable
  - donor_col:
      type: string
      description: Optional obs column used as the donor identifier

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: Unified AnnData with standardised metadata and counts
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
