name: "adata_upsetgenes"
description: Plot an UpSet diagram of gene-set overlaps across AnnData objects
keywords:
  - upset
  - genes
  - anndata
  - single-cell
tools:
  - "upsetplot":
      description: "Draw UpSet plots of set intersections in Python"
      homepage: "https://upsetplot.readthedocs.io"
      documentation: "https://upsetplot.readthedocs.io"
      tool_dev_url: "https://github.com/jnothman/UpSetPlot"
      licence: ["BSD-3-Clause"]
  - "anndata":
      description: "Annotated data matrices in Python"
      homepage: "https://anndata.readthedocs.io"
      documentation: "https://anndata.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/anndata"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - names:
        type: string
        description: Display names corresponding to each AnnData input
    - h5ads:
        type: file
        description: AnnData objects whose gene sets are compared
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"

output:
  plot:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.png":
          type: file
          description: Optional UpSet plot of gene-set overlaps
          pattern: "*.png"
  multiqc_files:
    - "*_mqc.json":
        type: file
        description: Optional MultiQC custom content JSON for the UpSet plot
        pattern: "*_mqc.json"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
