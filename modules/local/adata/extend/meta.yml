name: "adata_extend"
description: Merge obs, var, obsm, obsp, uns and layer artefacts into a base AnnData object
keywords:
  - anndata
  - merge
  - single-cell
tools:
  - "anndata":
      description: "Annotated data matrices in Python"
      homepage: "https://anndata.readthedocs.io"
      documentation: "https://anndata.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/anndata"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - base:
        type: file
        description: Base AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
    - obs:
        type: file
        description: Optional Parquet obs tables with an explicit __index__ column
        pattern: "*.parquet"
    - var:
        type: file
        description: Optional Parquet var tables with an explicit __index__ column
        pattern: "*.parquet"
    - obsm:
        type: file
        description: Optional Parquet embedding tables indexed by cell identifiers in __index__
        pattern: "*.parquet"
    - obsp:
        type: file
        description: Optional sparse obsp matrices stored as NumPy objects
        pattern: "*.npy"
    - uns:
        type: file
        description: Optional indexed Parquet DataFrames or pickled non-tabular uns objects
        pattern: "*.{parquet,pkl}"
    - layers:
        type: file
        description: Optional layer matrices as numpy, Matrix Market or sparse files
        pattern: "*.{npy,npz,mtx}"

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: Extended AnnData object with merged annotations and layers
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  metadata:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.csv":
          type: file
          description: Cell metadata table exported from obs
          pattern: "*.csv"
          ontologies:
            - edam: "http://edamontology.org/format_3752"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
