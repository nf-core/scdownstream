name: "adata_extend"
description: Extend a base AnnData object with additional obs, var, obsm, obsp, uns, and layer data from staged files
keywords:
  - single-cell
  - anndata
  - merge
  - metadata
tools:
  - "anndata":
      description: "An annotated data matrix"
      homepage: "https://anndata.readthedocs.io"
      documentation: "https://anndata.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/anndata"
      licence:
        - "BSD-3-Clause"
      identifier: biotools:anndata
input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. `[ id:'sample1' ]`
  - base:
      type: file
      description: Base AnnData object in h5ad format
      pattern: "*.{h5ad}"
      ontologies:
        - edam: "http://edamontology.org/format_3590"
  - obs:
      type: file
      description: Directory of obs tables to append, as pickle or CSV files
      pattern: "*.{pkl,csv}"
      ontologies:
        - edam: http://edamontology.org/format_3752 # CSV
  - var:
      type: file
      description: Directory of var tables to append, as pickle or CSV files
      pattern: "*.{pkl,csv}"
      ontologies:
        - edam: http://edamontology.org/format_3752 # CSV
  - obsm:
      type: file
      description: Directory of obsm matrices to append, as pickle files
      pattern: "*.pkl"
      ontologies: []
  - obsp:
      type: file
      description: Directory of obsp matrices to append, as NumPy files
      pattern: "*.npy"
      ontologies:
        - edam: http://edamontology.org/format_4003 # NumPy format
  - uns:
      type: file
      description: Directory of uns entries to append, as pickle files
      pattern: "*.pkl"
      ontologies: []
  - layers:
      type: file
      description: Directory of layer matrices to append, as NPZ, MTX, or NumPy files
      pattern: "*.{npz,mtx,npy}"

      ontologies:
        - edam: http://edamontology.org/format_3916 # MTX
        - edam: http://edamontology.org/format_4003 # NumPy format
output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: Extended AnnData object in h5ad format
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  metadata:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.csv":
          type: file
          description: CSV export of the extended obs metadata table
          pattern: "*.csv"
          ontologies:
            - edam: "http://edamontology.org/format_3752" # CSV
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
topics:
  versions:
    - versions.yml:
        type: string
        description: The name of the process
authors:
  - "@nictru"
maintainers:
  - "@nictru"
