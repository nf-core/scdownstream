name: "adata_extend"
description: Merge obs, var, obsm, obsp, uns and layer artefacts into a base AnnData object
keywords:
  - anndata
  - merge
  - single-cell
tools:
  - "anndata":
      description: "Annotated data matrices in Python"
      homepage: "https://anndata.readthedocs.io"
      documentation: "https://anndata.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/anndata"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - base:
        type: file
        description: Base AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
    - obs:
        type: file
        description: Optional obs tables as pickle or CSV files
        pattern: "*.{pkl,csv}"
    - var:
        type: file
        description: Optional var tables as pickle or CSV files
        pattern: "*.{pkl,csv}"
    - obsm:
        type: file
        description: Optional obsm matrices as pickle or numpy files
        pattern: "*.{pkl,npy,npz}"
    - obsp:
        type: file
        description: Optional obsp matrices as pickle or numpy files
        pattern: "*.{pkl,npy,npz}"
    - uns:
        type: file
        description: Optional uns objects as pickle files
        pattern: "*.pkl"
    - layers:
        type: file
        description: Optional layer matrices as numpy, Matrix Market or sparse files
        pattern: "*.{npy,npz,mtx}"

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: Extended AnnData object with merged annotations and layers
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  metadata:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.csv":
          type: file
          description: Cell metadata table exported from obs
          pattern: "*.csv"
          ontologies:
            - edam: "http://edamontology.org/format_3752"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
