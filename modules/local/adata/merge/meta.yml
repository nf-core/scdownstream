name: "adata_merge"
description: Merge multiple AnnData objects with an outer gene join and prepare an integration subset
keywords:
  - single-cell
  - anndata
  - merge
  - integration
  - scanpy
tools:
  - "scanpy":
      description: "Single-cell analysis in Python"
      homepage: "https://scanpy.readthedocs.io"
      documentation: "https://scanpy.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/scanpy"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ads:
        type: file
        description: AnnData objects in h5ad format to merge
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - - meta2:
        type: map
        description: |
          Groovy Map containing sample information for the base dataset
          e.g. `[ id:'base' ]`
    - base:
        type: file
        description: Optional base AnnData object used to define known labels for integration
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - force_obs_cols:
      type: string
      description: Comma-separated obs columns to retain even when they are not shared across all samples

output:
  outer:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*_outer.h5ad":
          type: file
          description: Merged AnnData object with outer gene join
          pattern: "*_outer.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  integrate:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*_integrate.h5ad":
          type: file
          description: AnnData subset prepared for integration, excluding base cells when a base dataset is provided
          pattern: "*_integrate.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
