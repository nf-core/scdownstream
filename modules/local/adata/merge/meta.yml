name: "adata_merge"
description: Concatenate sample AnnData objects into outer-join and integration-ready datasets
keywords:
  - anndata
  - concatenate
  - single-cell
tools:
  - "scanpy":
      description: "Single-cell analysis in Python"
      homepage: "https://scanpy.readthedocs.io"
      documentation: "https://scanpy.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/scanpy"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ads:
        type: file
        description: Sample AnnData objects to concatenate
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - - meta2:
        type: map
        description: |
          Groovy Map containing information for the optional base AnnData
          e.g. `[ id:'base' ]`
    - base:
        type: file
        description: Optional base AnnData used when merging onto an existing object
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"

output:
  outer:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*_outer.h5ad":
          type: file
          description: Outer-join concatenated AnnData object
          pattern: "*_outer.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  integrate:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*_integrate.h5ad":
          type: file
          description: AnnData prepared for downstream integration
          pattern: "*_integrate.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
