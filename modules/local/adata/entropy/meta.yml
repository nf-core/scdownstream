name: "adata_entropy"
description: Compute normalised Shannon entropy of a categorical observation column within groups
keywords:
  - entropy
  - single-cell
  - anndata
  - scanpy
tools:
  - "scanpy":
      description: "Single-cell analysis in Python"
      homepage: "https://scanpy.readthedocs.io"
      documentation: "https://scanpy.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/scanpy"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - group_col:
      type: string
      description: obs column used to group cells before computing entropy
  - entropy_col:
      type: string
      description: Categorical obs column whose distribution entropy is computed within each group
  - plot_basis:
      type: string
      description: Optional embedding basis for an entropy scatter plot; empty string disables plotting

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData object with a normalised entropy column added to obs
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  obs:
    - "*.pkl":
        type: file
        description: Pickled obs subset containing the entropy column
        pattern: "*.pkl"
  plots:
    - "*.png":
        type: file
        description: Optional scatter plot of entropy values
        pattern: "*.png"
  multiqc_files:
    - "*_mqc.json":
        type: file
        description: Optional MultiQC custom content JSON for the entropy plot
        pattern: "*_mqc.json"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
