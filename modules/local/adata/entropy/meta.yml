name: "adata_entropy"
description: Compute normalised Shannon entropy of a cell annotation within groups and store it in obs
keywords:
  - entropy
  - anndata
  - single-cell
tools:
  - "scanpy":
      description: "Single-cell analysis in Python"
      homepage: "https://scanpy.readthedocs.io"
      documentation: "https://scanpy.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/scanpy"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - group_col:
      type: string
      description: obs column used to group cells for entropy calculation
  - entropy_col:
      type: string
      description: obs column whose label distribution is used to compute entropy
  - plot_basis:
      type: string
      description: obsm basis for the entropy scatter plot, for example `umap`. An empty string skips the plot.

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData with a normalised entropy column in obs
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  obs:
    - "*.parquet":
        type: file
        description: Parquet obs subset containing the entropy column and an explicit __index__ column
        pattern: "*.parquet"
  plots:
    - "*.png":
        type: file
        description: Optional UMAP coloured by entropy
        pattern: "*.png"
  multiqc_files:
    - "*_mqc.json":
        type: file
        description: Optional MultiQC custom content JSON for the entropy plot
        pattern: "*_mqc.json"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
