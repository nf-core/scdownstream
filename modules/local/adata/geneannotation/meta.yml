name: "adata_geneannotation"
description: Annotate the genes of an AnnData object with biotype, chromosome and a broad biotype group, from a GTF-derived table or from mygene
keywords:
  - gene-annotation
  - biotype
  - mygene
  - gtf
  - anndata
  - single-cell
tools:
  - "mygene":
      description: "Python client for MyGene.info gene annotation services"
      homepage: "https://docs.mygene.info"
      documentation: "https://docs.mygene.info/en/latest/"
      tool_dev_url: "https://github.com/biothings/mygene.py"
      licence: ["BSD-3-Clause"]
  - "anndata":
      description: "Annotated data matrices in Python"
      homepage: "https://anndata.readthedocs.io"
      documentation: "https://anndata.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/anndata"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'merged' ]`
    - h5ad:
        type: file
        description: AnnData object whose var index holds the genes to annotate
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - gene_table:
      type: file
      description: |
        Optional tab-separated gene table as written by atlasgeneannotationmanipulation/gtf2featureannotation
        (columns gene_id, chromosome, gene_biotype or gene_type, and optionally gene_name).
        When empty, annotations are retrieved from mygene.
      pattern: "*.tsv"
      ontologies:
        - edam: "http://edamontology.org/format_3475"
  - species:
      type: string
      description: Species name or taxonomy identifier passed to mygene. Unused when a gene table is given.

output:
  var:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'merged' ]`
      - "*.pkl":
          type: file
          description: |
            Pickled pandas DataFrame indexed by var name with categorical columns gene_biotype,
            chromosome and biotype_group, and boolean gene_annotation_ambiguous, for ADATA_EXTEND
          pattern: "*.pkl"
  csv:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'merged' ]`
      - "*.csv":
          type: file
          description: The same gene table as CSV
          pattern: "*.csv"
          ontologies:
            - edam: "http://edamontology.org/format_3752"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@kroy3"
maintainers:
  - "@kroy3"
