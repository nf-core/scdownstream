name: "adata_readrds"
description: Convert a Seurat or SingleCellExperiment RDS object to AnnData h5ad
keywords:
  - anndata
  - seurat
  - single-cell
  - rds
tools:
  - "anndata2ri":
      description: "Interop between AnnData and SingleCellExperiment"
      homepage: "https://github.com/theislab/anndata2ri"
      documentation: "https://github.com/theislab/anndata2ri"
      tool_dev_url: "https://github.com/theislab/anndata2ri"
      licence: ["GPL-3.0-or-later"]
  - "seurat":
      description: "R toolkit for single-cell genomics"
      homepage: "https://satijalab.org/seurat/"
      documentation: "https://satijalab.org/seurat/"
      tool_dev_url: "https://github.com/satijalab/seurat"
      licence: ["MIT"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - rds:
        type: file
        description: Seurat or SingleCellExperiment object in RDS format
        pattern: "*.{rds,RDS}"
        ontologies:
          - edam: "http://edamontology.org/format_8910"

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData object converted from the RDS input
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
