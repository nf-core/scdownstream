name: "adata_mergeembeddings"
description: Merge integration embeddings from base and integrated datasets into a combined AnnData object
keywords:
  - single-cell
  - anndata
  - embeddings
  - integration
tools:
  - "anndata":
      description: "An annotated data matrix"
      homepage: "https://anndata.readthedocs.io"
      documentation: "https://anndata.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/anndata"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - integration_key:
        type: string
        description: obsm key suffix identifying the integration embedding to merge
    - integrated:
        type: file
        description: Integrated AnnData object containing embedding coordinates for new cells
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
    - base:
        type: file
        description: Base AnnData object containing embedding coordinates for reference cells
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
    - combined:
        type: file
        description: Combined AnnData object to receive the merged embedding
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: Combined AnnData object with merged embedding in obsm
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  obs:
    - "*.pkl":
        type: file
        description: Optional pickled obs subset containing scANVI labels when integration_key is scanvi
        pattern: "*.pkl"
  obsm:
    - "X_*.pkl":
        type: file
        description: Pickled embedding matrix written from obsm
        pattern: "X_*.pkl"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
