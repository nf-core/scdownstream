name: "adata_mergeembeddings"
description: Transfer an integrated embedding into the combined AnnData object
keywords:
  - anndata
  - embeddings
  - integration
  - single-cell
tools:
  - "scanpy":
      description: "Single-cell analysis in Python"
      homepage: "https://scanpy.readthedocs.io"
      documentation: "https://scanpy.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/scanpy"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - integration_key:
        type: string
        description: Key under which the integrated embedding is stored
    - integrated:
        type: file
        description: Integrated AnnData containing the embedding to transfer
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
    - base:
        type: file
        description: Base AnnData used as a reference for cell alignment
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
    - combined:
        type: file
        description: Combined AnnData that receives the merged embedding
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData with the merged integration embedding
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  obs:
    - "*.pkl":
        type: file
        description: Optional pickled obs table
        pattern: "*.pkl"
  obsm:
    - "X_*.pkl":
        type: file
        description: Pickled obsm embedding matrix
        pattern: "X_*.pkl"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
