name: "adata_tords"
description: Convert an AnnData object to a SingleCellExperiment RDS file
keywords:
  - single-cell
  - anndata
  - rds
  - export
  - bioconductor
tools:
  - "anndataR":
      description: "R package for reading and writing AnnData objects"
      homepage: "https://bioconductor.org/packages/anndataR"
      documentation: "https://bioconductor.org/packages/release/bioc/html/anndataR.html"
      tool_dev_url: "https://github.com/scverse/anndataR"
      licence:
        - "MIT"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - counts_layer:
      type: string
      description: Layer or X matrix to use as the counts assay in the output SingleCellExperiment

output:
  rds:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.rds":
          type: file
          description: SingleCellExperiment object saved as an RDS file
          pattern: "*.rds"
          ontologies: []
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
topics:
  versions:
    - versions.yml:
        type: string
        description: The name of the process
authors:
  - "@nictru"
maintainers:
  - "@nictru"
