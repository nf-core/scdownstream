name: "adata_tords"
description: Convert an AnnData h5ad object to a SingleCellExperiment RDS file
keywords:
  - anndata
  - singlecellexperiment
  - rds
  - single-cell
tools:
  - "anndataR":
      description: "Interop between AnnData and Bioconductor SingleCellExperiment"
      homepage: "https://bioconductor.org/packages/anndataR/"
      documentation: "https://bioconductor.org/packages/release/bioc/html/anndataR.html"
      tool_dev_url: "https://github.com/scverse/anndataR"
      licence: ["MIT"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - counts_layer:
      type: string
      description: Layer or `X` used as the counts assay in the RDS object

output:
  rds:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.rds":
          type: file
          description: SingleCellExperiment object in RDS format
          pattern: "*.rds"
          ontologies:
            - edam: "http://edamontology.org/format_8910"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
