name: "adata_splitembeddings"
description: Split an AnnData object into separate h5ad files, one per obsm embedding
keywords:
  - single-cell
  - anndata
  - embeddings
  - split
tools:
  - "anndata":
      description: "An annotated data matrix"
      homepage: "https://anndata.readthedocs.io"
      documentation: "https://anndata.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/anndata"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - embeddings:
      type: string
      description: List of obsm embedding key suffixes to split, without the X_ prefix

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData objects, one per requested embedding
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
