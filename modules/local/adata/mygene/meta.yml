name: "adata_mygene"
description: Map gene identifiers to symbols with mygene and store them in var
keywords:
  - mygene
  - gene-annotation
  - anndata
  - single-cell
tools:
  - "mygene":
      description: "Python client for MyGene.info gene annotation services"
      homepage: "https://docs.mygene.info"
      documentation: "https://docs.mygene.info/en/latest/"
      tool_dev_url: "https://github.com/biothings/mygene.py"
      licence: ["BSD-3-Clause"]
  - "anndata":
      description: "Annotated data matrices in Python"
      homepage: "https://anndata.readthedocs.io"
      documentation: "https://anndata.readthedocs.io"
      tool_dev_url: "https://github.com/scverse/anndata"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - species:
      type: string
      description: Species name or taxonomy identifier passed to mygene

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData with gene symbols written to var
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
