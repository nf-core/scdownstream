name: "adata_mygene"
description: Map gene identifiers in var to symbols using MyGene.info
keywords:
  - single-cell
  - anndata
  - gene-annotation
  - mygene
tools:
  - "mygene":
      description: "Python client for the MyGene.info gene annotation service"
      homepage: "https://docs.mygene.info"
      documentation: "https://docs.mygene.info/en/latest/doc/quick_start.html"
      tool_dev_url: "https://github.com/biothings/mygene.py"
      licence: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: AnnData object in h5ad format
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
  - species:
      type: string
      description: Species name passed to MyGene.info for identifier lookup
  - input_col:
      type: string
      description: var column containing gene identifiers to look up; use `index` for the var index
  - output_col:
      type: string
      description: var column name for mapped gene symbols; use `index` to replace the var index

output:
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: AnnData object with gene symbols added to var
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nictru"
maintainers:
  - "@nictru"
